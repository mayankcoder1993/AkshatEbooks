<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="100%" height="100%">
  <defs>
    <filter id="akshayEurekaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="160" cy="220" r="130" fill="#FEF9C3" opacity="0.6"/>

  <g filter="url(#akshayEurekaShadow)" transform="translate(40, 20)">
    <!-- Mustard Kurta Body -->
    <path d="M 60,160 L 170,160 L 180,340 L 45,340 Z" fill="#F59E0B" stroke="#B45309" stroke-width="4"/>
    <!-- Collar & Placket -->
    <path d="M 105,160 L 125,160 L 120,230 L 110,230 Z" fill="#D97706" stroke="#78350F" stroke-width="2"/>

    <!-- Left Arm Raised in Fist Pump / Victory -->
    <path d="M 65,170 L 30,120 L 50,85" stroke="#F59E0B" stroke-width="16" stroke-linecap="round" fill="none"/>
    <circle cx="50" cy="80" r="11" fill="#FDE68A" stroke="#B45309" stroke-width="2"/>

    <!-- Right Arm Holding Notebook / Slate -->
    <path d="M 165,170 L 195,220 L 175,250" stroke="#F59E0B" stroke-width="16" stroke-linecap="round" fill="none"/>
    <circle cx="175" cy="255" r="9" fill="#FDE68A" stroke="#B45309" stroke-width="2"/>

    <!-- Spark / Eureka Lightbulb Glow -->
    <circle cx="50" cy="50" r="14" fill="#FBBF24"/>
    <polygon points="50,30 54,42 66,42 56,50 60,62 50,54 40,62 44,50 34,42 46,42" fill="#FEF08A"/>

    <!-- Neck -->
    <rect x="100" y="130" width="30" height="35" fill="#FDE68A" stroke="#B45309" stroke-width="3"/>

    <!-- Head & Face (Smiling / Radiant) -->
    <ellipse cx="115" cy="95" rx="36" ry="42" fill="#FDE68A" stroke="#0F172A" stroke-width="4"/>

    <!-- Hair -->
    <path d="M 78,85 C 75,45 95,35 115,35 C 140,35 152,45 150,85 C 142,55 130,50 115,50 C 100,50 88,58 78,85 Z" fill="#1E293B"/>

    <!-- Bright Almond Eyes -->
    <ellipse cx="102" cy="90" rx="7" ry="6" fill="#0F172A"/>
    <ellipse cx="128" cy="90" rx="7" ry="6" fill="#0F172A"/>
    <circle cx="100" cy="88" r="2" fill="#FFFFFF"/>
    <circle cx="126" cy="88" r="2" fill="#FFFFFF"/>

    <!-- Big Eureka Smile -->
    <path d="M 102,112 Q 115,126 128,112 Z" fill="#991B1B" stroke="#0F172A" stroke-width="2"/>
    <rect x="106" y="112" width="18" height="4" fill="#FFFFFF"/>
  </g>

  <!-- Tag -->
  <rect x="70" y="365" width="180" height="26" rx="13" fill="#16A34A"/>
  <text x="160" y="382" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">AKSHAY · EUREKA MOMENT</text>
</svg>
