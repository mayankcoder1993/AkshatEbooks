<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="100%" height="100%" style="background:#FFFFFF;">
  <defs>
    <!-- Filter for clean drop shadows on speech bubbles -->
    <filter id="bubbleShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1B2A4A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean Background -->
  <rect width="1200" height="580" fill="#FFFFFF"/>

  <!-- Campus Quad Archway Background -->
  <g stroke="#CBD5E1" stroke-width="2" fill="none">
    <path d="M 60,520 L 60,180 Q 60,120 120,120 L 320,120 Q 380,120 380,180 L 380,520" />
    <path d="M 80,520 L 80,190 Q 80,140 130,140 L 310,140 Q 360,140 360,190 L 360,520" />
    <line x1="40" y1="520" x2="1160" y2="520" stroke="#94A3B8" stroke-width="3" />
    <!-- Clock Tower in distance reading 08:30 AM -->
    <rect x="200" y="40" width="80" height="90" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" rx="4"/>
    <circle cx="240" cy="85" r="28" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
    <line x1="240" y1="85" x2="240" y2="65" stroke="#D9383A" stroke-width="3" stroke-linecap="round"/>
    <line x1="240" y1="85" x2="255" y2="85" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
    <text x="240" y="125" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#D9383A" text-anchor="middle">08:30 AM</text>
  </g>

  <!-- Fellow Panicking Student (Left) -->
  <g transform="translate(180, 240)">
    <!-- Student Body -->
    <path d="M 40,160 L 25,280 L 55,280 L 60,200 L 75,280 L 105,280 L 85,160 Z" fill="#3B82F6" stroke="#1E3A8A" stroke-width="3"/>
    <!-- Student Head -->
    <circle cx="60" cy="90" r="32" fill="#FDE68A" stroke="#1E3A8A" stroke-width="3"/>
    <!-- Expressive Panicked Eyes & Mouth -->
    <circle cx="50" cy="85" r="5" fill="#0F172A"/>
    <circle cx="70" cy="85" r="5" fill="#0F172A"/>
    <ellipse cx="60" cy="105" rx="8" ry="10" fill="#D9383A"/>
    <!-- Smartphone in hand displaying error -->
    <rect x="90" y="130" width="30" height="50" rx="4" fill="#0F172A" stroke="#475569" stroke-width="2"/>
    <circle cx="105" cy="155" r="8" fill="none" stroke="#EF4444" stroke-width="3" stroke-dasharray="12 6"/>
  </g>

  <!-- Fellow Student Speech Bubble -->
  <g filter="url(#bubbleShadow)" transform="translate(60, 40)">
    <path d="M 20,0 L 320,0 Q 340,0 340,20 L 340,100 Q 340,120 320,120 L 220,120 L 200,150 L 190,120 L 20,120 Q 0,120 0,100 L 0,20 Q 0,0 20,0 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <text x="25" y="32" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#64748B">FELLOW STUDENT (PANICKING)</text>
    <text x="25" y="58" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#0F172A">"The Admit Card portal is frozen!</text>
    <text x="25" y="80" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#0F172A">Twelve thousand students hit it</text>
    <text x="25" y="102" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#D9383A">at once and it crashed!"</text>
  </g>

  <!-- Student Akshay Sprinting in Distress (Center Right) -->
  <g transform="translate(620, 180)">
    <!-- Motion lines -->
    <path d="M -80,100 L -20,100 M -60,130 L -10,130 M -90,160 L -30,160" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>

    <!-- Leaking Backpack on Back with Dripping Water -->
    <rect x="-35" y="110" width="45" height="70" rx="10" fill="#0D9488" stroke="#115E59" stroke-width="3"/>
    <path d="M -15,185 Q -10,210 -15,225" stroke="#0284C7" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="-15" cy="235" r="4" fill="#0284C7"/>
    <circle cx="-10" cy="255" r="3" fill="#0284C7"/>
    <text x="-35" y="275" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0284C7">WATER LEAK</text>

    <!-- Running Legs (Mustard Pajama) -->
    <path d="M 30,220 L -20,320 L 10,330 L 45,245 L 85,310 L 115,300 L 60,220 Z" fill="#D97706" stroke="#92400E" stroke-width="3"/>

    <!-- Akshay Torso (Mustard Kurta) -->
    <path d="M 15,100 L 75,90 L 85,225 L 10,225 Z" fill="#F59E0B" stroke="#B45309" stroke-width="3"/>

    <!-- Head & Face (Distressed / Sweating) -->
    <circle cx="55" cy="50" r="34" fill="#FDE68A" stroke="#92400E" stroke-width="3"/>
    <!-- Hair -->
    <path d="M 25,45 Q 35,15 65,18 Q 85,20 90,40 Q 75,30 55,30 Z" fill="#1E293B"/>
    <!-- Distressed Almond Eyes -->
    <ellipse cx="45" cy="48" rx="6" ry="7" fill="#0F172A"/>
    <ellipse cx="68" cy="46" rx="6" ry="7" fill="#0F172A"/>
    <circle cx="43" cy="46" r="2" fill="#FFFFFF"/>
    <circle cx="66" cy="44" r="2" fill="#FFFFFF"/>
    <!-- Open Gasping Mouth -->
    <ellipse cx="58" cy="68" rx="8" ry="11" fill="#991B1B"/>
    <!-- Sweat Droplets -->
    <path d="M 88,40 Q 94,45 88,52 Q 82,45 88,40 Z" fill="#38BDF8"/>
    <path d="M 22,50 Q 26,55 22,60 Q 18,55 22,50 Z" fill="#38BDF8"/>

    <!-- Arm Extended Holding Smudged Admit Card -->
    <path d="M 65,115 L 140,110 L 155,130" stroke="#B45309" stroke-width="12" fill="none" stroke-linecap="round"/>

    <!-- Smudged Printed Admit Card Document -->
    <g transform="translate(145, 80) rotate(8)">
      <rect x="0" y="0" width="130" height="170" rx="4" fill="#FFFFFF" stroke="#0F172A" stroke-width="3" filter="url(#bubbleShadow)"/>
      <!-- Header -->
      <rect x="0" y="0" width="130" height="30" fill="#1E3A8A"/>
      <text x="65" y="20" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">APEX BOARD EXAM</text>
      <!-- Text details -->
      <text x="10" y="46" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#334155">STUDENT: AKSHAY</text>
      <text x="10" y="60" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#334155">REG: APX102</text>
      <!-- Water Smudge Obliterating Hall & Seat Number -->
      <rect x="8" y="72" width="114" height="48" fill="#E0F2FE" stroke="#0284C7" stroke-width="1" stroke-dasharray="3 3"/>
      <path d="M 12,85 Q 35,70 60,90 Q 85,110 115,80 Q 90,120 50,115 Q 20,110 12,85 Z" fill="#38BDF8" opacity="0.75"/>
      <text x="65" y="96" font-family="Inter, sans-serif" font-size="11" font-weight="900" fill="#0369A1" text-anchor="middle">INK DISSOLVED</text>
      <text x="65" y="112" font-family="Inter, sans-serif" font-size="9" font-weight="800" fill="#0C4A6E" text-anchor="middle">HALL &amp; SEAT: ???</text>
      <!-- Date -->
      <text x="10" y="136" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="#64748B">DATE: TODAY 09:00 AM</text>
      <text x="10" y="152" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#DC2626">ENTRY CLOSES: 08:50</text>
    </g>
  </g>

  <!-- Akshay Speech Bubble -->
  <g filter="url(#bubbleShadow)" transform="translate(680, 20)">
    <path d="M 20,0 L 440,0 Q 460,0 460,20 L 460,110 Q 460,130 440,130 L 140,130 L 110,165 L 115,130 L 20,130 Q 0,130 0,110 L 0,20 Q 0,0 20,0 Z" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5"/>
    <text x="25" y="30" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#B45309">STUDENT AKSHAY (DISTRESSED)</text>
    <text x="25" y="56" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0F172A">"Water leaked inside my bag! The blue ink</text>
    <text x="25" y="78" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0F172A">over my Room and Seat number has dissolved!</text>
    <text x="25" y="100" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#B91C1C">Gates lock in 20 minutes! Without seat details,</text>
    <text x="25" y="120" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#DC2626">I face an automatic year-back!"</text>
  </g>

  <!-- Bottom Narration Caption -->
  <rect x="60" y="525" width="1080" height="42" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="80" y="551" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#334155"><tspan font-weight="800" fill="#0F172A">SCENE 1:</tspan> Apex Engineering College Quad · 08:30 AM · Akshay races against the clock with a smudged Hall Ticket.</text>
</svg>
