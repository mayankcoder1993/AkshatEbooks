<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 395" width="100%" class="svg-api-workbench">
  <!-- Outer Window Frame -->
  <rect x="0" y="0" width="720" height="395" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Titlebar Header -->
  <path d="M 0 10 Q 0 0 10 0 L 710 0 Q 720 0 720 10 L 720 38 L 0 38 Z" fill="#f8fafc"/>
  <line x1="0" y1="38" x2="720" y2="38" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Traffic Light Window Controls -->
  <circle cx="22" cy="19" r="5" fill="#ef4444"/>
  <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
  <circle cx="50" cy="19" r="5" fill="#10b981"/>
  <text x="70" y="23" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="700">API TESTING WORKBENCH · INCIDENT WIRE AUDIT</text>

  <!-- Request Address Bar Box -->
  <rect x="15" y="48" width="690" height="36" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  
  <!-- HTTP Method Badge -->
  <rect x="22" y="54" width="56" height="24" rx="4" fill="#0284c7"/>
  <text x="50" y="70" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">GET</text>
  
  <!-- Target URL String with Missing Parameter Alert -->
  <text x="88" y="71" fill="#0f172a" font-family="monospace" font-size="12" font-weight="600">http://localhost:5050/v1/shuttle/route</text>
  <rect x="420" y="56" width="180" height="20" rx="4" fill="rgba(239, 68, 68, 0.12)"/>
  <text x="510" y="70" fill="#dc2626" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">ROUTE PARAM OMITTED</text>
  
  <!-- Send Button -->
  <rect x="615" y="54" width="80" height="24" rx="4" fill="#0284c7"/>
  <text x="655" y="70" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Send</text>

  <!-- Response Meta Banner -->
  <rect x="15" y="92" width="690" height="30" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="25" y="112" fill="#991b1b" font-family="sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.05em">CRASHED WIRE RESPONSE</text>
  
  <!-- Status Badge (500 Error) -->
  <rect x="480" y="97" width="150" height="20" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="555" y="111" fill="#b91c1c" font-family="monospace" font-size="11" font-weight="800" text-anchor="middle">500 SERVER ERROR</text>
  
  <!-- Latency Badge -->
  <text x="690" y="111" fill="#64748b" font-family="monospace" font-size="11" text-anchor="end">42 ms</text>
  
  <!-- Response JSON Stream Leaking Stack Trace -->
  <g class="response-json-body">
    <text x="24" y="145" fill="#0f172a" font-family="monospace" font-size="12">{</text>
    <text x="24" y="165" fill="#0f172a" font-family="monospace" font-size="12">  &quot;error&quot;: &quot;INTERNAL_SERVER_ERROR&quot;,</text>
    <text x="24" y="185" fill="#b91c1c" font-family="monospace" font-size="12">  &quot;message&quot;: &quot;TypeError: Cannot read properties of undefined (reading 'trim')&quot;,</text>
    <text x="24" y="205" fill="#64748b" font-family="monospace" font-size="11">  &quot;file&quot;: &quot;/services/shuttle_service.js:42:28&quot;,</text>
    <text x="24" y="225" fill="#64748b" font-family="monospace" font-size="11">  &quot;stack&quot;: [</text>
    <text x="24" y="245" fill="#94a3b8" font-family="monospace" font-size="10.5">    &quot;at RouteLocatorService.lookupRoute (/services/shuttle_service.js:42:28)&quot;,</text>
    <text x="24" y="265" fill="#94a3b8" font-family="monospace" font-size="10.5">    &quot;at Layer.handle [as handle_request] (/node_modules/express/lib/router/layer.js:95:5)&quot;,</text>
    <text x="24" y="285" fill="#94a3b8" font-family="monospace" font-size="10.5">    &quot;at next (/node_modules/express/lib/router/route.js:144:13)&quot;</text>
    <text x="24" y="305" fill="#64748b" font-family="monospace" font-size="11">  ]</text>
    <text x="24" y="325" fill="#0f172a" font-family="monospace" font-size="12">}</text>
  </g>

  <!-- Grounding Banner -->
  <rect x="15" y="345" width="690" height="38" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="25" y="368" fill="#475569" font-family="sans-serif" font-size="11" font-weight="700">DIAGNOSIS: req.query.name evaluated to undefined. Calling .trim() threw an uncaught TypeError.</text>
</svg>