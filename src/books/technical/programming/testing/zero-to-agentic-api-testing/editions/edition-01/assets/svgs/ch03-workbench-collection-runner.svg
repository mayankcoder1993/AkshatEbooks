<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 395" width="100%" class="svg-api-workbench">
  <!-- Outer Window Frame -->
  <rect x="0" y="0" width="720" height="395" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Titlebar Header -->
  <path d="M 0 10 Q 0 0 10 0 L 710 0 Q 720 0 720 10 L 720 38 L 0 38 Z" fill="#f8fafc"/>
  <line x1="0" y1="38" x2="720" y2="38" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Traffic Light Window Controls -->
  <circle cx="22" cy="19" r="5" fill="#ef4444"/>
  <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
  <circle cx="50" cy="19" r="5" fill="#10b981"/>
  <text x="70" y="23" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="700">COLLECTION RUNNER · TRANSIT &amp; CATALOG AUTOMATION</text>

  <!-- Summary Metric Dashboard Bar -->
  <rect x="15" y="48" width="690" height="42" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="30" y="73" fill="#166534" font-family="sans-serif" font-size="11" font-weight="800">RUN SUMMARY:</text>
  
  <rect x="130" y="58" width="100" height="22" rx="4" fill="#ffffff" stroke="#86efac"/>
  <text x="180" y="73" fill="#15803d" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">4 / 4 Requests</text>

  <rect x="240" y="58" width="120" height="22" rx="4" fill="#16a34a"/>
  <text x="300" y="73" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">10 Passed · 0 Failed</text>

  <rect x="370" y="58" width="100" height="22" rx="4" fill="#ffffff" stroke="#86efac"/>
  <text x="420" y="73" fill="#15803d" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Duration: 86 ms</text>

  <rect x="580" y="58" width="115" height="22" rx="4" fill="#0284c7"/>
  <text x="637" y="73" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">Run Again</text>

  <!-- Requests Execution Table Header -->
  <rect x="15" y="100" width="690" height="28" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="25" y="118" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="800">#</text>
  <text x="45" y="118" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="800">METHOD &amp; REQUEST NAME</text>
  <text x="380" y="118" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="800">STATUS</text>
  <text x="480" y="118" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="800">ASSERTIONS</text>
  <text x="630" y="118" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="800">TIME</text>

  <!-- Row 1: Health Check -->
  <rect x="15" y="130" width="690" height="46" fill="#ffffff" stroke="#f1f5f9"/>
  <circle cx="28" cy="153" r="8" fill="#dcfce7"/>
  <text x="28" y="157" fill="#15803d" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">✓</text>
  <rect x="45" y="141" width="40" height="22" rx="3" fill="#0284c7"/>
  <text x="65" y="156" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">GET</text>
  <text x="95" y="156" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="700">01 - Health Check Endpoint</text>
  <rect x="380" y="142" width="70" height="20" rx="3" fill="#dcfce7"/>
  <text x="415" y="156" fill="#15803d" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">200 OK</text>
  <text x="480" y="156" fill="#15803d" font-family="sans-serif" font-size="10.5" font-weight="700">2 / 2 passed</text>
  <text x="645" y="156" fill="#64748b" font-family="monospace" font-size="10">12 ms</text>

  <!-- Row 2: Shuttle Route Guard Check -->
  <rect x="15" y="178" width="690" height="46" fill="#ffffff" stroke="#f1f5f9"/>
  <circle cx="28" cy="201" r="8" fill="#dcfce7"/>
  <text x="28" y="205" fill="#15803d" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">✓</text>
  <rect x="45" y="189" width="40" height="22" rx="3" fill="#0284c7"/>
  <text x="65" y="204" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">GET</text>
  <text x="95" y="204" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="700">02 - Shuttle Omitted Route Guard</text>
  <rect x="380" y="190" width="85" height="20" rx="3" fill="#fef3c7"/>
  <text x="422" y="204" fill="#b45309" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">400 BAD REQ</text>
  <text x="480" y="204" fill="#15803d" font-family="sans-serif" font-size="10.5" font-weight="700">2 / 2 passed</text>
  <text x="645" y="204" fill="#64748b" font-family="monospace" font-size="10">4 ms</text>

  <!-- Row 3: Shuttle Valid Route Contract -->
  <rect x="15" y="226" width="690" height="46" fill="#ffffff" stroke="#f1f5f9"/>
  <circle cx="28" cy="249" r="8" fill="#dcfce7"/>
  <text x="28" y="253" fill="#15803d" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">✓</text>
  <rect x="45" y="237" width="40" height="22" rx="3" fill="#0284c7"/>
  <text x="65" y="252" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">GET</text>
  <text x="95" y="252" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="700">03 - Shuttle Valid Route Contract</text>
  <rect x="380" y="238" width="70" height="20" rx="3" fill="#dcfce7"/>
  <text x="415" y="252" fill="#15803d" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">200 OK</text>
  <text x="480" y="252" fill="#15803d" font-family="sans-serif" font-size="10.5" font-weight="700">3 / 3 passed</text>
  <text x="645" y="252" fill="#64748b" font-family="monospace" font-size="10">8 ms</text>

  <!-- Row 4: Catalog Verification -->
  <rect x="15" y="274" width="690" height="46" fill="#ffffff" stroke="#f1f5f9"/>
  <circle cx="28" cy="297" r="8" fill="#dcfce7"/>
  <text x="28" y="301" fill="#15803d" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">✓</text>
  <rect x="45" y="285" width="40" height="22" rx="3" fill="#0284c7"/>
  <text x="65" y="300" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">GET</text>
  <text x="95" y="300" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="700">04 - Course Catalog Verification</text>
  <rect x="380" y="286" width="70" height="20" rx="3" fill="#dcfce7"/>
  <text x="415" y="300" fill="#15803d" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">200 OK</text>
  <text x="480" y="300" fill="#15803d" font-family="sans-serif" font-size="10.5" font-weight="700">3 / 3 passed</text>
  <text x="645" y="300" fill="#64748b" font-family="monospace" font-size="10">14 ms</text>

  <!-- Grounding Strip -->
  <rect x="15" y="340" width="690" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="25" y="365" fill="#334155" font-family="sans-serif" font-size="11" font-weight="700">PIPELINE READY: The entire test suite executed deterministically in 86 milliseconds. Zero regressions.</text>
</svg>