<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 395" width="100%" class="svg-api-workbench">
  <!-- Outer Window Frame -->
  <rect x="0" y="0" width="720" height="395" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Titlebar Header -->
  <path d="M 0 10 Q 0 0 10 0 L 710 0 Q 720 0 720 10 L 720 38 L 0 38 Z" fill="#f8fafc"/>
  <line x1="0" y1="38" x2="720" y2="38" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Traffic Light Window Controls -->
  <circle cx="22" cy="19" r="5" fill="#ef4444"/>
  <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
  <circle cx="50" cy="19" r="5" fill="#10b981"/>
  <text x="70" y="23" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="700">API TESTING WORKBENCH · ACTIVE ROUTE CONTRACT</text>

  <!-- Request Address Bar Box -->
  <rect x="15" y="48" width="690" height="36" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  
  <!-- HTTP Method Badge -->
  <rect x="22" y="54" width="56" height="24" rx="4" fill="#0284c7"/>
  <text x="50" y="70" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">GET</text>
  
  <!-- Target URL String with Parameter -->
  <text x="88" y="71" fill="#0f172a" font-family="monospace" font-size="12" font-weight="600">http://localhost:5050/v1/shuttle/route?name=north_loop</text>
  
  <!-- Send Button -->
  <rect x="615" y="54" width="80" height="24" rx="4" fill="#0284c7"/>
  <text x="655" y="70" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Send</text>

  <!-- Response Meta Banner -->
  <rect x="15" y="92" width="690" height="30" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="25" y="112" fill="#166534" font-family="sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.05em">LIVE CONTRACT PAYLOAD</text>
  
  <!-- Status Badge (200 OK) -->
  <rect x="520" y="97" width="110" height="20" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="575" y="111" fill="#15803d" font-family="monospace" font-size="11" font-weight="800" text-anchor="middle">200 OK</text>
  
  <!-- Latency Badge -->
  <text x="690" y="111" fill="#16a34a" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">8 ms</text>
  
  <!-- Response JSON Stream -->
  <g class="response-json-body">
    <text x="24" y="145" fill="#0f172a" font-family="monospace" font-size="12">{</text>
    <text x="24" y="165" fill="#0f172a" font-family="monospace" font-size="12">  &quot;status&quot;: &quot;ACTIVE&quot;,</text>
    <text x="24" y="185" fill="#0f172a" font-family="monospace" font-size="12">  &quot;route&quot;: &quot;NORTH_LOOP&quot;,</text>
    <text x="24" y="205" fill="#0f172a" font-family="monospace" font-size="12">  &quot;activeShuttles&quot;: 3,</text>
    <text x="24" y="225" fill="#0f172a" font-family="monospace" font-size="12">  &quot;coordinates&quot;: [</text>
    <text x="24" y="245" fill="#0f172a" font-family="monospace" font-size="12">    { &quot;stop&quot;: &quot;Main Academic Gate&quot;, &quot;lat&quot;: 28.5452, &quot;lng&quot;: 77.1924 },</text>
    <text x="24" y="265" fill="#0f172a" font-family="monospace" font-size="12">    { &quot;stop&quot;: &quot;Central Library Quad&quot;, &quot;lat&quot;: 28.5487, &quot;lng&quot;: 77.1951 },</text>
    <text x="24" y="285" fill="#0f172a" font-family="monospace" font-size="12">    { &quot;stop&quot;: &quot;Engineering Block East&quot;, &quot;lat&quot;: 28.5521, &quot;lng&quot;: 77.1993 }</text>
    <text x="24" y="305" fill="#0f172a" font-family="monospace" font-size="12">  ]</text>
    <text x="24" y="325" fill="#0f172a" font-family="monospace" font-size="12">}</text>
  </g>

  <!-- Grounding Banner -->
  <rect x="15" y="340" width="690" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="25" y="365" fill="#334155" font-family="sans-serif" font-size="11" font-weight="700">CONTRACT RESTORED: Valid query parameter parsed cleanly. Coordinates return in 8 milliseconds.</text>
</svg>