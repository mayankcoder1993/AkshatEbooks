<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 395" width="100%" class="svg-api-workbench">
  <!-- Outer Window Frame -->
  <rect x="0" y="0" width="720" height="395" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Titlebar Header -->
  <path d="M 0 10 Q 0 0 10 0 L 710 0 Q 720 0 720 10 L 720 38 L 0 38 Z" fill="#f8fafc"/>
  <line x1="0" y1="38" x2="720" y2="38" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Traffic Light Window Controls -->
  <circle cx="22" cy="19" r="5" fill="#ef4444"/>
  <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
  <circle cx="50" cy="19" r="5" fill="#10b981"/>
  <text x="70" y="23" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="700">API TESTING WORKBENCH · POSITIVE CONTRACT ASSERTIONS</text>

  <!-- Request Address Bar Box -->
  <rect x="15" y="48" width="690" height="36" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="22" y="54" width="56" height="24" rx="4" fill="#0284c7"/>
  <text x="50" y="70" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">GET</text>
  <text x="88" y="71" fill="#0f172a" font-family="monospace" font-size="12" font-weight="600">http://localhost:5050/v1/shuttle/route?name=north_loop</text>
  <rect x="615" y="54" width="80" height="24" rx="4" fill="#0284c7"/>
  <text x="655" y="70" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Send</text>

  <!-- Left Column: Tests Script Sandbox -->
  <g transform="translate(15, 92)">
    <rect x="0" y="0" width="340" height="245" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="0" y="0" width="340" height="28" rx="6" fill="#f1f5f9"/>
    <text x="12" y="19" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="800">TESTS SCRIPT SANDBOX (CHAI BDD)</text>

    <text x="12" y="48" fill="#0284c7" font-family="monospace" font-size="10.5">pm.test<tspan fill="#0f172a">(&quot;Status is 200 OK&quot;, () =&gt; {</tspan></text>
    <text x="12" y="66" fill="#0f172a" font-family="monospace" font-size="10.5">  pm.response.to.have.status(200);</text>
    <text x="12" y="84" fill="#0f172a" font-family="monospace" font-size="10.5">});</text>

    <text x="12" y="108" fill="#0284c7" font-family="monospace" font-size="10.5">pm.test<tspan fill="#0f172a">(&quot;Active route confirmed&quot;, () =&gt; {</tspan></text>
    <text x="12" y="126" fill="#475569" font-family="monospace" font-size="10.5">  const body = pm.response.json();</text>
    <text x="12" y="144" fill="#0f172a" font-family="monospace" font-size="10.5">  pm.expect(body.status).to.eql(&quot;ACTIVE&quot;);</text>
    <text x="12" y="162" fill="#0f172a" font-family="monospace" font-size="10.5">});</text>

    <text x="12" y="186" fill="#0284c7" font-family="monospace" font-size="10.5">pm.test<tspan fill="#0f172a">(&quot;Coordinates array populated&quot;, () =&gt; {</tspan></text>
    <text x="12" y="204" fill="#475569" font-family="monospace" font-size="10.5">  const body = pm.response.json();</text>
    <text x="12" y="222" fill="#0f172a" font-family="monospace" font-size="10.5">  pm.expect(body.coordinates).to.be.an(&quot;array&quot;);</text>
    <text x="12" y="240" fill="#0f172a" font-family="monospace" font-size="10.5">});</text>
  </g>

  <!-- Right Column: Test Results Verdict (ALL GREEN PASS) -->
  <g transform="translate(365, 92)">
    <rect x="0" y="0" width="340" height="245" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <rect x="0" y="0" width="340" height="28" rx="6" fill="#dcfce7"/>
    <text x="12" y="19" fill="#166534" font-family="sans-serif" font-size="11" font-weight="800">TEST RESULTS (3/3 PASSED)</text>
    <rect x="250" y="5" width="80" height="18" rx="3" fill="#16a34a"/>
    <text x="290" y="18" fill="#ffffff" font-family="monospace" font-size="10" font-weight="800" text-anchor="middle">PASS 3/3</text>

    <!-- Pass Item 1 -->
    <rect x="12" y="40" width="316" height="38" rx="4" fill="#ffffff" stroke="#86efac"/>
    <circle cx="28" cy="59" r="7" fill="#16a34a"/>
    <text x="28" y="63" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="800" text-anchor="middle">✓</text>
    <text x="44" y="58" fill="#14532d" font-family="sans-serif" font-size="10.5" font-weight="800">PASS: Status is 200 OK</text>
    <text x="44" y="72" fill="#64748b" font-family="monospace" font-size="9">pm.response.to.have.status(200)</text>

    <!-- Pass Item 2 -->
    <rect x="12" y="86" width="316" height="38" rx="4" fill="#ffffff" stroke="#86efac"/>
    <circle cx="28" cy="105" r="7" fill="#16a34a"/>
    <text x="28" y="109" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="800" text-anchor="middle">✓</text>
    <text x="44" y="104" fill="#14532d" font-family="sans-serif" font-size="10.5" font-weight="800">PASS: Active route confirmed</text>
    <text x="44" y="118" fill="#64748b" font-family="monospace" font-size="9">body.status strictly equals ACTIVE</text>

    <!-- Pass Item 3 -->
    <rect x="12" y="132" width="316" height="38" rx="4" fill="#ffffff" stroke="#86efac"/>
    <circle cx="28" cy="151" r="7" fill="#16a34a"/>
    <text x="28" y="155" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="800" text-anchor="middle">✓</text>
    <text x="44" y="150" fill="#14532d" font-family="sans-serif" font-size="10.5" font-weight="800">PASS: Coordinates array populated</text>
    <text x="44" y="164" fill="#64748b" font-family="monospace" font-size="9">coordinates is Array with 3 stops</text>

    <!-- Execution Timing Box -->
    <rect x="12" y="180" width="316" height="52" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="22" y="202" fill="#0f172a" font-family="sans-serif" font-size="10" font-weight="700">EXECUTION BENCHMARK:</text>
    <text x="22" y="220" fill="#15803d" font-family="monospace" font-size="10">All 3 assertions evaluated in 8 ms</text>
  </g>

  <!-- Grounding Strip -->
  <rect x="15" y="345" width="690" height="38" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="25" y="368" fill="#334155" font-family="sans-serif" font-size="11" font-weight="700">GREEN CERTAINTY: Assertions check both envelope status and payload data structures.</text>
</svg>