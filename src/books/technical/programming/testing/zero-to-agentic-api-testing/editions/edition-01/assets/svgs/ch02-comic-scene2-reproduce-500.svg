<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="100%" height="100%" style="background:#FFFFFF;">
  <defs>
    <filter id="ch02BubbleShadow2" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1B2A4A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean Pure White Background -->
  <rect width="1200" height="580" fill="#FFFFFF"/>

  <g stroke="#CBD5E1" stroke-width="2" fill="none">
    <line x1="50" y1="520" x2="1150" y2="520" stroke="#94A3B8" stroke-width="3"/>
  </g>

  <!-- Big Red Terminal Reproducing the 500 Crash (Center Left) -->
  <g transform="translate(80, 160)" filter="url(#ch02BubbleShadow2)">
    <rect x="0" y="0" width="660" height="340" rx="10" fill="#0F172A" stroke="#334155" stroke-width="3"/>
    <rect x="0" y="0" width="660" height="36" rx="10" fill="#1E293B"/>
    <circle cx="20" cy="18" r="6" fill="#EF4444"/>
    <circle cx="38" cy="18" r="6" fill="#F59E0B"/>
    <circle cx="56" cy="18" r="6" fill="#10B981"/>
    <text x="330" y="24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#94A3B8" text-anchor="middle">terminal · curl http://localhost:3000/v1/shuttle/route (root cause reproduction)</text>

    <!-- Curl Command -->
    <text x="25" y="70" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#38BDF8">$ curl -i http://localhost:3000/v1/shuttle/route</text>
    <text x="25" y="92" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#EF4444">HTTP/1.1 500 Internal Server Error</text>
    <text x="25" y="112" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">Content-Type: text/html; charset=utf-8 | Connection: close</text>

    <!-- Stacktrace Box -->
    <rect x="15" y="125" width="630" height="195" rx="6" fill="#180404" stroke="#DC2626" stroke-width="2"/>
    <text x="30" y="152" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#F87171">TypeError: Cannot read properties of undefined (reading 'trim')</text>
    <text x="30" y="174" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FCA5A5">    at RouteLocatorService.lookup (/app/services/routes.js:42:25)</text>
    <text x="30" y="194" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FCA5A5">    at /app/controllers/shuttleController.js:18:32</text>
    <text x="30" y="214" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FCA5A5">    at Layer.handle [as handle_request] (/app/node_modules/express/lib/router/layer.js:95:5)</text>

    <!-- Root Cause Note -->
    <rect x="25" y="235" width="610" height="70" rx="4" fill="#450A0A" stroke="#EF4444" stroke-width="1"/>
    <text x="35" y="258" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#FDE047">ROOT CAUSE IDENTIFIED: THREE WAYS TO BE EMPTY</text>
    <text x="35" y="278" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">1. req.query.name is undefined (omitted)   2. req.query.name is "" (empty string)</text>
    <text x="35" y="294" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FCA5A5">Calling .trim() without an existence guard crashes the entire node process!</text>
  </g>

  <!-- Akshay Scratching Head at Screen (Right Center) -->
  <g transform="translate(780, 220)">
    <path d="M 35,90 L 105,90 L 100,210 L 40,210 Z" fill="#F59E0B" stroke="#B45309" stroke-width="3"/>
    <circle cx="70" cy="45" r="32" fill="#FDE68A" stroke="#92400E" stroke-width="3"/>
    <circle cx="60" cy="45" r="6" fill="#0F172A"/>
    <circle cx="82" cy="45" r="6" fill="#0F172A"/>
    <!-- Confused Mouth -->
    <ellipse cx="71" cy="65" rx="6" ry="8" fill="#991B1B"/>
    <!-- Hand Scratching Head -->
    <path d="M 100,105 L 115,70 L 95,35" stroke="#B45309" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Akshay Speech Bubble -->
  <g filter="url(#ch02BubbleShadow2)" transform="translate(80, 20)">
    <path d="M 20,0 L 460,0 Q 480,0 480,20 L 480,105 Q 480,125 460,125 L 360,125 L 380,155 L 390,125 L 20,125 Q 0,125 0,105 L 0,20 Q 0,0 20,0 Z" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5"/>
    <text x="25" y="30" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#B45309">STUDENT AKSHAY (DIAGNOSING 500)</text>
    <text x="25" y="56" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0F172A">"We omitted the route parameter in our curl call,</text>
    <text x="25" y="78" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0F172A">and the server blew up with a 500 Internal Error!</text>
    <text x="25" y="100" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#DC2626">Line 42 tried to call .trim() on undefined!"</text>
  </g>

  <!-- Sameer Pointing to Stack Trace (Far Right) -->
  <g transform="translate(980, 220)">
    <path d="M 40,90 L 110,90 L 100,210 L 45,210 Z" fill="#1E3A8A" stroke="#0F172A" stroke-width="3"/>
    <circle cx="75" cy="45" r="32" fill="#FDE68A" stroke="#0F172A" stroke-width="3"/>
    <rect x="62" y="38" width="14" height="10" rx="2" fill="none" stroke="#0F172A" stroke-width="2"/>
    <rect x="80" y="38" width="14" height="10" rx="2" fill="none" stroke="#0F172A" stroke-width="2"/>
    <!-- Pointing Finger -->
    <path d="M 45,110 L -30,110 L -50,110" stroke="#1E3A8A" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Sameer Speech Bubble -->
  <g filter="url(#ch02BubbleShadow2)" transform="translate(680, 20)">
    <path d="M 20,0 L 480,0 Q 500,0 500,20 L 500,105 Q 500,125 480,125 L 260,125 L 245,155 L 235,125 L 20,125 Q 0,125 0,105 L 0,20 Q 0,0 20,0 Z" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.5"/>
    <text x="25" y="30" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#15803D">SAMEER (ROOT CAUSE CONFIRMATION)</text>
    <text x="25" y="56" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0F172A">"An unhandled exception is bad engineering.</text>
    <text x="25" y="78" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Clients make mistakes every day. The server must</text>
    <text x="25" y="100" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#047857">defend itself with input validation and return 400 Bad Request."</text>
  </g>

  <!-- Bottom Narration Caption -->
  <rect x="60" y="525" width="1080" height="42" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="80" y="551" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#334155"><tspan font-weight="800" fill="#0F172A">SCENE 2:</tspan> Workstation Terminal · 08:25 PM · Akshay reproduces the unhandled trim crash under laboratory conditions.</text>
</svg>
