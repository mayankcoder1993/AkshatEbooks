<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 395" width="100%" class="svg-api-workbench">
  <!-- Outer Window Frame -->
  <rect x="0" y="0" width="720" height="395" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Titlebar Header -->
  <path d="M 0 10 Q 0 0 10 0 L 710 0 Q 720 0 720 10 L 720 38 L 0 38 Z" fill="#f8fafc"/>
  <line x1="0" y1="38" x2="720" y2="38" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Traffic Light Window Controls -->
  <circle cx="22" cy="19" r="5" fill="#ef4444"/>
  <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
  <circle cx="50" cy="19" r="5" fill="#10b981"/>
  <text x="70" y="23" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="700">API TESTING WORKBENCH · RED BEFORE GREEN VERIFICATION</text>

  <!-- Request Address Bar Box -->
  <rect x="15" y="48" width="690" height="36" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="22" y="54" width="56" height="24" rx="4" fill="#0284c7"/>
  <text x="50" y="70" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">GET</text>
  <text x="88" y="71" fill="#0f172a" font-family="monospace" font-size="12" font-weight="600">http://localhost:5050/v1/shuttle/route</text>
  <rect x="615" y="54" width="80" height="24" rx="4" fill="#0284c7"/>
  <text x="655" y="70" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Send</text>

  <!-- Left Column: Tests Script Sandbox -->
  <g transform="translate(15, 92)">
    <rect x="0" y="0" width="340" height="245" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="0" y="0" width="340" height="28" rx="6" fill="#f1f5f9"/>
    <text x="12" y="19" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="800">TESTS SCRIPT SANDBOX (JAVASCRIPT)</text>

    <text x="12" y="52" fill="#64748b" font-family="monospace" font-size="11">// Enforcing Red Before Green</text>
    <text x="12" y="72" fill="#0284c7" font-family="monospace" font-size="11">pm.test<tspan fill="#0f172a">(&quot;Negative Guard 400&quot;, () =&gt; {</tspan></text>
    <text x="12" y="94" fill="#0f172a" font-family="monospace" font-size="11">  pm.response.to.have.status(400);</text>
    <text x="12" y="116" fill="#0f172a" font-family="monospace" font-size="11">});</text>

    <rect x="12" y="145" width="316" height="85" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="22" y="168" fill="#475569" font-family="sans-serif" font-size="10.5" font-weight="700">EXPERIMENTAL SETUP:</text>
    <text x="22" y="188" fill="#64748b" font-family="sans-serif" font-size="10">Targeting unhardened endpoint returning 500.</text>
    <text x="22" y="208" fill="#64748b" font-family="sans-serif" font-size="10">Proving the assertion can fail before trusting it.</text>
  </g>

  <!-- Right Column: Test Results Verdict (RED FAILURE) -->
  <g transform="translate(365, 92)">
    <rect x="0" y="0" width="340" height="245" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <rect x="0" y="0" width="340" height="28" rx="6" fill="#fee2e2"/>
    <text x="12" y="19" fill="#991b1b" font-family="sans-serif" font-size="11" font-weight="800">TEST RESULTS (0/1 PASSED)</text>
    <rect x="260" y="5" width="70" height="18" rx="3" fill="#ef4444"/>
    <text x="295" y="18" fill="#ffffff" font-family="monospace" font-size="10" font-weight="800" text-anchor="middle">FAIL 1</text>

    <!-- Failed Assertion Banner -->
    <rect x="12" y="42" width="316" height="52" rx="4" fill="#ffffff" stroke="#fca5a5"/>
    <circle cx="28" cy="62" r="7" fill="#ef4444"/>
    <text x="28" y="66" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">✕</text>
    <text x="44" y="60" fill="#991b1b" font-family="sans-serif" font-size="11" font-weight="800">Negative Guard 400</text>
    <text x="44" y="78" fill="#64748b" font-family="monospace" font-size="9.5">AssertionError: expected 500 to equal 400</text>

    <!-- Detailed Error Diagnostic Box -->
    <rect x="12" y="104" width="316" height="126" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="22" y="126" fill="#0f172a" font-family="sans-serif" font-size="10.5" font-weight="700">ASSERTION VERDICT:</text>
    <text x="22" y="146" fill="#b91c1c" font-family="monospace" font-size="10">Expected: HTTP 400 Bad Request</text>
    <text x="22" y="166" fill="#b91c1c" font-family="monospace" font-size="10">Actual Wire: HTTP 500 Server Error</text>
    <text x="22" y="190" fill="#065f46" font-family="sans-serif" font-size="10" font-weight="700">✓ SCIENTIFIC PROOF ACHIEVED:</text>
    <text x="22" y="208" fill="#047857" font-family="sans-serif" font-size="9.5">The test actively caught the unhandled crash.</text>
  </g>

  <!-- Grounding Strip -->
  <rect x="15" y="345" width="690" height="38" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="25" y="368" fill="#334155" font-family="sans-serif" font-size="11" font-weight="700">RED DISCIPLINE: A test that has never been observed failing is merely an illusion of security.</text>
</svg>