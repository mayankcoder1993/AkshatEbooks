<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="100%" height="100%">
  <defs>
    <filter id="akshayPanicShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="160" cy="220" r="130" fill="#FEF2F2" opacity="0.6"/>

  <g filter="url(#akshayPanicShadow)" transform="translate(40, 20)">
    <!-- Mustard Handloom Kurta Body -->
    <path d="M 60,160 L 170,160 L 180,340 L 45,340 Z" fill="#F59E0B" stroke="#B45309" stroke-width="4"/>
    <!-- Collar & Placket with geometric embroidery -->
    <path d="M 105,160 L 125,160 L 120,230 L 110,230 Z" fill="#D97706" stroke="#78350F" stroke-width="2"/>

    <!-- Satchel Bag strap across chest -->
    <line x1="60" y1="165" x2="160" y2="280" stroke="#0F766E" stroke-width="14" stroke-linecap="round"/>

    <!-- Left Arm Holding Soaked Paper -->
    <path d="M 65,170 L 25,210 L 40,240" stroke="#F59E0B" stroke-width="16" stroke-linecap="round" fill="none"/>
    <circle cx="40" cy="245" r="9" fill="#FDE68A" stroke="#B45309" stroke-width="2"/>

    <!-- Soaked Admit Card Sheet with Dissolved Blue Ink -->
    <g transform="translate(10, 220) rotate(-10)">
      <rect x="0" y="0" width="60" height="80" rx="3" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
      <rect x="0" y="0" width="60" height="14" fill="#1E3A8A"/>
      <circle cx="30" cy="40" r="16" fill="#38BDF8" opacity="0.7"/>
      <path d="M 15,35 Q 30,25 45,35 Q 35,55 15,35 Z" fill="#0284C7" opacity="0.8"/>
      <text x="30" y="44" font-family="Inter, sans-serif" font-size="7" font-weight="900" fill="#FFFFFF" text-anchor="middle">???</text>
    </g>

    <!-- Right Arm Raised to Head in Panic -->
    <path d="M 165,170 L 195,130 L 165,100" stroke="#F59E0B" stroke-width="16" stroke-linecap="round" fill="none"/>
    <circle cx="165" cy="100" r="9" fill="#FDE68A" stroke="#B45309" stroke-width="2"/>

    <!-- Neck -->
    <rect x="100" y="130" width="30" height="35" fill="#FDE68A" stroke="#B45309" stroke-width="3"/>

    <!-- Head & Face (Distressed) -->
    <ellipse cx="115" cy="95" rx="36" ry="42" fill="#FDE68A" stroke="#0F172A" stroke-width="4"/>

    <!-- Youthful Short Black Parted Hair -->
    <path d="M 78,85 C 75,45 95,35 115,35 C 140,35 152,45 150,85 C 142,55 130,50 115,50 C 100,50 88,58 78,85 Z" fill="#1E293B"/>

    <!-- Wide Panicked Almond Eyes -->
    <ellipse cx="102" cy="90" rx="7" ry="9" fill="#0F172A"/>
    <ellipse cx="128" cy="90" rx="7" ry="9" fill="#0F172A"/>
    <circle cx="100" cy="88" r="2.5" fill="#FFFFFF"/>
    <circle cx="126" cy="88" r="2.5" fill="#FFFFFF"/>

    <!-- Sweating / Brow Lines -->
    <path d="M 94,76 Q 102,70 110,74" stroke="#0F172A" stroke-width="2.5" fill="none"/>
    <path d="M 120,74 Q 128,70 136,76" stroke="#0F172A" stroke-width="2.5" fill="none"/>

    <!-- Sweat Drops -->
    <path d="M 148,80 Q 154,85 148,92 Q 142,85 148,80 Z" fill="#38BDF8"/>
    <path d="M 80,95 Q 85,100 80,105 Q 75,100 80,95 Z" fill="#38BDF8"/>

    <!-- Open Gasping Mouth -->
    <ellipse cx="115" cy="118" rx="8" ry="12" fill="#991B1B"/>
    <rect x="110" y="108" width="10" height="4" rx="2" fill="#FFFFFF"/>
  </g>

  <!-- Tag -->
  <rect x="70" y="365" width="180" height="26" rx="13" fill="#DC2626"/>
  <text x="160" y="382" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">AKSHAY · CRISIS PANIC</text>
</svg>
