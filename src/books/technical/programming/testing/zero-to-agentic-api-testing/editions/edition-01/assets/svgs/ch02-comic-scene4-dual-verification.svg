<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="100%" height="100%" style="background:#FFFFFF;">
  <defs>
    <filter id="ch02BubbleShadow4" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1B2A4A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean Pure White Background -->
  <rect width="1200" height="580" fill="#FFFFFF"/>

  <g stroke="#CBD5E1" stroke-width="2" fill="none">
    <line x1="50" y1="520" x2="1150" y2="520" stroke="#94A3B8" stroke-width="3"/>
  </g>

  <!-- Dual Wire Verification Split Screen (Center Left) -->
  <g transform="translate(80, 160)" filter="url(#ch02BubbleShadow4)">
    <rect x="0" y="0" width="680" height="340" rx="10" fill="#0F172A" stroke="#334155" stroke-width="3"/>
    <rect x="0" y="0" width="680" height="36" rx="10" fill="#1E293B"/>
    <circle cx="20" cy="18" r="6" fill="#EF4444"/>
    <circle cx="38" cy="18" r="6" fill="#F59E0B"/>
    <circle cx="56" cy="18" r="6" fill="#10B981"/>
    <text x="340" y="24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#94A3B8" text-anchor="middle">terminal · dual wire verification (defensive guard + happy path)</text>

    <!-- Top Pane: Defensive Guard Branch (400 Bad Request) -->
    <g transform="translate(15, 48)">
      <rect x="0" y="0" width="650" height="125" rx="6" fill="#020617" stroke="#F59E0B" stroke-width="1.5"/>
      <rect x="0" y="0" width="650" height="24" rx="6" fill="#451A03"/>
      <text x="12" y="16" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#FBBF24">BRANCH 1: REJECTING BAD INPUT (DEFENSIVE GUARD)</text>
      <text x="12" y="44" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8">$ curl -i http://localhost:3000/v1/shuttle/route</text>
      <text x="12" y="64" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#F59E0B">HTTP/1.1 400 Bad Request</text>
      <text x="12" y="84" font-family="'JetBrains Mono', monospace" font-size="11" fill="#CBD5E1">{ "error": "Query parameter 'name' is required (e.g. ?name=north-loop)" }</text>
      <text x="12" y="104" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#FDE047">✓ Pass: Server gracefully rejected bad request with actionable guidance</text>
    </g>

    <!-- Bottom Pane: Happy Path Branch (200 OK) -->
    <g transform="translate(15, 185)">
      <rect x="0" y="0" width="650" height="135" rx="6" fill="#020617" stroke="#10B981" stroke-width="1.5"/>
      <rect x="0" y="0" width="650" height="24" rx="6" fill="#064E3B"/>
      <text x="12" y="16" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#34D399">BRANCH 2: SERVING VALID INPUT (HAPPY PATH)</text>
      <text x="12" y="44" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8">$ curl -i http://localhost:3000/v1/shuttle/route?name=north-loop</text>
      <text x="12" y="64" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#10B981">HTTP/1.1 200 OK</text>
      <text x="12" y="84" font-family="'JetBrains Mono', monospace" font-size="11" fill="#CBD5E1">{ "route": "north-loop", "activeBuses": 3, "coords": [12.9716, 77.5946] }</text>
      <text x="12" y="112" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#34D399">✓ Full Contract Verified: Both branches return deterministic status codes!</text>
    </g>
  </g>

  <!-- Sameer Mentoring (Right Center) -->
  <g transform="translate(800, 220)">
    <path d="M 40,90 L 110,90 L 100,210 L 45,210 Z" fill="#1E3A8A" stroke="#0F172A" stroke-width="3"/>
    <circle cx="75" cy="45" r="32" fill="#FDE68A" stroke="#0F172A" stroke-width="3"/>
    <rect x="62" y="38" width="14" height="10" rx="2" fill="none" stroke="#0F172A" stroke-width="2"/>
    <rect x="80" y="38" width="14" height="10" rx="2" fill="none" stroke="#0F172A" stroke-width="2"/>
    <path d="M 45,110 L -30,110 L -50,110" stroke="#1E3A8A" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Sameer Speech Bubble -->
  <g filter="url(#ch02BubbleShadow4)" transform="translate(680, 20)">
    <path d="M 20,0 L 480,0 Q 500,0 500,20 L 500,105 Q 500,125 480,125 L 260,125 L 245,155 L 235,125 L 20,125 Q 0,125 0,105 L 0,20 Q 0,0 20,0 Z" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.5"/>
    <text x="25" y="30" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#15803D">SAMEER (THE AUTOMATION HOOK)</text>
    <text x="25" y="56" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0F172A">"Manual eyeballing confirmed this once.</text>
    <text x="25" y="78" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0F172A">But what happens on redeployment tomorrow?</text>
    <text x="25" y="100" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#047857">In Chapter 3, we build the automated watchdog!"</text>
  </g>

  <!-- Akshay Celebrating with Fist Pump (Far Right) -->
  <g transform="translate(1020, 230)">
    <path d="M 35,90 L 105,90 L 95,210 L 40,210 Z" fill="#F59E0B" stroke="#B45309" stroke-width="3"/>
    <circle cx="70" cy="45" r="32" fill="#FDE68A" stroke="#92400E" stroke-width="3"/>
    <!-- Fist Pump Arm -->
    <path d="M 90,100 L 125,60 L 115,40" stroke="#B45309" stroke-width="10" fill="none" stroke-linecap="round"/>
    <circle cx="115" cy="38" r="8" fill="#FDE68A"/>
    <!-- Victory Smile -->
    <path d="M 60,60 Q 71,76 82,60" stroke="#991B1B" stroke-width="3.5" fill="none"/>
  </g>

  <!-- Akshay Speech Bubble -->
  <g filter="url(#ch02BubbleShadow4)" transform="translate(80, 20)">
    <path d="M 20,0 L 460,0 Q 480,0 480,20 L 480,105 Q 480,125 460,125 L 360,125 L 380,155 L 390,125 L 20,125 Q 0,125 0,105 L 0,20 Q 0,0 20,0 Z" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5"/>
    <text x="25" y="30" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#B45309">STUDENT AKSHAY (VICTORY)</text>
    <text x="25" y="56" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0F172A">"Both contract paths are rock solid!</text>
    <text x="25" y="78" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0F172A">400 Bad Request protects against bad input,</text>
    <text x="25" y="100" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#15803D">and 200 OK delivers bus coordinates at lightning speed!"</text>
  </g>

  <!-- Bottom Narration Caption -->
  <rect x="60" y="525" width="1080" height="42" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="80" y="551" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#334155"><tspan font-weight="800" fill="#0F172A">SCENE 4:</tspan> Dual Wire Verification · 08:35 PM · Akshay confirms both the 400 defensive guard and the 200 happy path.</text>
</svg>
