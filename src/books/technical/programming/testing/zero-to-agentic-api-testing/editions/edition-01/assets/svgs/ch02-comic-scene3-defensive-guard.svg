<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="100%" height="100%" style="background:#FFFFFF;">
  <defs>
    <filter id="ch02BubbleShadow3" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1B2A4A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean Pure White Background -->
  <rect width="1200" height="580" fill="#FFFFFF"/>

  <g stroke="#CBD5E1" stroke-width="2" fill="none">
    <line x1="50" y1="520" x2="1150" y2="520" stroke="#94A3B8" stroke-width="3"/>
  </g>

  <!-- Giant IDE Code Editor Showing the Defensive Guard (Center Left) -->
  <g transform="translate(80, 160)" filter="url(#ch02BubbleShadow3)">
    <rect x="0" y="0" width="680" height="340" rx="10" fill="#0F172A" stroke="#334155" stroke-width="3"/>
    <rect x="0" y="0" width="680" height="36" rx="10" fill="#1E293B"/>
    <circle cx="20" cy="18" r="6" fill="#EF4444"/>
    <circle cx="38" cy="18" r="6" fill="#F59E0B"/>
    <circle cx="56" cy="18" r="6" fill="#10B981"/>
    <text x="340" y="24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#94A3B8" text-anchor="middle">shuttleController.js · Defensive Input Guard Fix</text>

    <!-- Code Block -->
    <rect x="15" y="48" width="650" height="275" rx="6" fill="#020617"/>
    <text x="30" y="78" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38BDF8">app.get('/v1/shuttle/route', (req, res) =&gt; {</text>
    <text x="45" y="98" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0">  const routeName = req.query.name;</text>

    <!-- Highlighted Defensive Guard Box -->
    <rect x="35" y="110" width="610" height="110" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <text x="50" y="132" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#A7F3D0">// DEFENSIVE GUARD: Catch undefined, empty, or whitespace</text>
    <text x="50" y="152" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#FDE047">  if (!routeName || !routeName.trim()) {</text>
    <text x="65" y="172" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#F87171">    return res.status(400).json({</text>
    <text x="80" y="192" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FCA5A5">      error: "Query parameter 'name' is required (e.g. ?name=north-loop)"</text>
    <text x="65" y="210" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#F87171">    });</text>
    <text x="50" y="218" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#FDE047">  }</text>

    <text x="45" y="248" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0">  // Safe to call .trim() now!</text>
    <text x="45" y="268" font-family="'JetBrains Mono', monospace" font-size="12" fill="#4ADE80">  const coords = RouteLocatorService.lookup(routeName.trim());</text>
    <text x="45" y="288" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38BDF8">  res.status(200).json(coords);</text>
    <text x="30" y="308" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38BDF8">});</text>
  </g>

  <!-- Sameer Mentoring (Right Center) -->
  <g transform="translate(800, 220)">
    <path d="M 40,90 L 110,90 L 100,210 L 45,210 Z" fill="#1E3A8A" stroke="#0F172A" stroke-width="3"/>
    <circle cx="75" cy="45" r="32" fill="#FDE68A" stroke="#0F172A" stroke-width="3"/>
    <rect x="62" y="38" width="14" height="10" rx="2" fill="none" stroke="#0F172A" stroke-width="2"/>
    <rect x="80" y="38" width="14" height="10" rx="2" fill="none" stroke="#0F172A" stroke-width="2"/>
    <path d="M 45,110 L -30,110 L -50,110" stroke="#1E3A8A" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Sameer Speech Bubble -->
  <g filter="url(#ch02BubbleShadow3)" transform="translate(680, 20)">
    <path d="M 20,0 L 480,0 Q 500,0 500,20 L 500,105 Q 500,125 480,125 L 260,125 L 245,155 L 235,125 L 20,125 Q 0,125 0,105 L 0,20 Q 0,0 20,0 Z" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.5"/>
    <text x="25" y="30" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#15803D">SAMEER (INSTALLING THE GUARD)</text>
    <text x="25" y="56" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0F172A">"This defensive guard intercepts bad requests.</text>
    <text x="25" y="78" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Instead of dying with 500, the server politely</text>
    <text x="25" y="100" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#047857">tells the client: 400 Bad Request, param required!"</text>
  </g>

  <!-- Akshay Nodding with Understanding (Far Right) -->
  <g transform="translate(1020, 230)">
    <path d="M 35,90 L 105,90 L 95,210 L 40,210 Z" fill="#F59E0B" stroke="#B45309" stroke-width="3"/>
    <circle cx="70" cy="45" r="32" fill="#FDE68A" stroke="#92400E" stroke-width="3"/>
    <!-- Confident Smile -->
    <path d="M 60,62 Q 71,74 82,62" stroke="#991B1B" stroke-width="3" fill="none"/>
  </g>

  <!-- Akshay Speech Bubble -->
  <g filter="url(#ch02BubbleShadow3)" transform="translate(80, 20)">
    <path d="M 20,0 L 460,0 Q 480,0 480,20 L 480,105 Q 480,125 460,125 L 360,125 L 380,155 L 390,125 L 20,125 Q 0,125 0,105 L 0,20 Q 0,0 20,0 Z" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5"/>
    <text x="25" y="30" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#B45309">STUDENT AKSHAY (LIGHTBULB MOMENT)</text>
    <text x="25" y="56" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0F172A">"A 500 error is a confession of server guilt.</text>
    <text x="25" y="78" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0F172A">A 400 error is a helpful contract boundary!</text>
    <text x="25" y="100" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#B45309">We protect the server and guide the client!"</text>
  </g>

  <!-- Bottom Narration Caption -->
  <rect x="60" y="525" width="1080" height="42" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="80" y="551" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#334155"><tspan font-weight="800" fill="#0F172A">SCENE 3:</tspan> Workstation IDE · 08:31 PM · Installing the defensive input guard in shuttleController.js.</text>
</svg>
