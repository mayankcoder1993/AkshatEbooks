<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="100%" height="100%">
  <defs>
    <filter id="sameerThaliShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Grounding Glow -->
  <circle cx="160" cy="220" r="130" fill="#FEF3C7" opacity="0.6"/>

  <g filter="url(#sameerThaliShadow)" transform="translate(20, 20)">
    <!-- Indigo Kurta Body -->
    <path d="M 60,160 L 170,160 L 180,340 L 45,340 Z" fill="#1E3A8A" stroke="#0F172A" stroke-width="4"/>

    <!-- Left Arm Holding Edge of Thali -->
    <path d="M 65,170 L 100,210 L 130,225" stroke="#1E3A8A" stroke-width="16" stroke-linecap="round" fill="none"/>

    <!-- Right Arm Lifted Theatrically Holding Thali -->
    <path d="M 170,170 L 220,180 L 235,215" stroke="#1E3A8A" stroke-width="16" stroke-linecap="round" fill="none"/>

    <!-- Large Ornate Circular Brass Thali Platter -->
    <circle cx="195" cy="245" r="75" fill="#D97706" stroke="#78350F" stroke-width="4"/>
    <circle cx="195" cy="245" r="68" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
    <circle cx="195" cy="245" r="62" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>

    <!-- 6 Brass Katoris inside the Thali -->
    <!-- Katori 1: Sambar / Dal (Top) -->
    <circle cx="195" cy="200" r="15" fill="#DC2626" stroke="#7F1D1D" stroke-width="2"/>
    <!-- Katori 2: Rasam (Top-Right) -->
    <circle cx="230" cy="220" r="14" fill="#EA580C" stroke="#7C2D12" stroke-width="2"/>
    <!-- Katori 3: Kheer (Bottom-Right) -->
    <circle cx="230" cy="265" r="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <!-- Katori 4: Rice Mound (Center) -->
    <circle cx="195" cy="245" r="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Katori 5: Curd / Raita (Bottom-Left) -->
    <circle cx="160" cy="265" r="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
    <!-- Katori 6: Palak Paneer (Top-Left) -->
    <circle cx="160" cy="220" r="14" fill="#15803D" stroke="#14532D" stroke-width="2"/>

    <!-- Badge on Thali -->
    <rect x="155" y="295" width="80" height="20" rx="10" fill="#78350F"/>
    <text x="195" y="309" font-family="Inter, sans-serif" font-size="9" font-weight="800" fill="#FEF3C7" text-anchor="middle">PUT vs PATCH</text>

    <!-- Head & Face (Smiling Theatrically) -->
    <rect x="95" y="130" width="30" height="35" fill="#FDE68A" stroke="#92400E" stroke-width="3"/>
    <ellipse cx="110" cy="95" rx="36" ry="42" fill="#FDE68A" stroke="#0F172A" stroke-width="4"/>

    <!-- Hair (Salt-and-Pepper) -->
    <path d="M 74,90 C 72,50 90,40 110,40 C 135,40 150,50 148,90 C 140,60 125,55 110,55 C 95,55 82,62 74,90 Z" fill="#1E293B"/>

    <!-- Beard & Mustache -->
    <path d="M 82,105 C 82,135 100,146 110,146 C 120,146 138,135 138,105 C 130,118 120,122 110,122 C 100,122 90,118 82,105 Z" fill="#1E293B"/>

    <!-- Eyes (Amused) -->
    <ellipse cx="98" cy="92" rx="6" ry="4" fill="#0F172A"/>
    <ellipse cx="122" cy="92" rx="6" ry="4" fill="#0F172A"/>

    <!-- Spectacles -->
    <circle cx="98" cy="92" r="13" fill="none" stroke="#D97706" stroke-width="2.5"/>
    <circle cx="122" cy="92" r="13" fill="none" stroke="#D97706" stroke-width="2.5"/>
    <line x1="111" y1="92" x2="111" y2="92" stroke="#D97706" stroke-width="3"/>
  </g>

  <!-- Tag -->
  <rect x="70" y="365" width="180" height="26" rx="13" fill="#D97706"/>
  <text x="160" y="382" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">THE BRASS THALI RULE</text>
</svg>
