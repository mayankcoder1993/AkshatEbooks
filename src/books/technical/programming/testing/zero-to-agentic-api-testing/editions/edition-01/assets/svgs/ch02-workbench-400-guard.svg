<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 395" width="100%" class="svg-api-workbench">
  <!-- Outer Window Frame -->
  <rect x="0" y="0" width="720" height="395" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Titlebar Header -->
  <path d="M 0 10 Q 0 0 10 0 L 710 0 Q 720 0 720 10 L 720 38 L 0 38 Z" fill="#f8fafc"/>
  <line x1="0" y1="38" x2="720" y2="38" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Traffic Light Window Controls -->
  <circle cx="22" cy="19" r="5" fill="#ef4444"/>
  <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
  <circle cx="50" cy="19" r="5" fill="#10b981"/>
  <text x="70" y="23" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="700">API TESTING WORKBENCH · DEFENSIVE GUARD VERIFICATION</text>

  <!-- Request Address Bar Box -->
  <rect x="15" y="48" width="690" height="36" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  
  <!-- HTTP Method Badge -->
  <rect x="22" y="54" width="56" height="24" rx="4" fill="#0284c7"/>
  <text x="50" y="70" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">GET</text>
  
  <!-- Target URL String -->
  <text x="88" y="71" fill="#0f172a" font-family="monospace" font-size="12" font-weight="600">http://localhost:5050/v1/shuttle/route</text>
  
  <!-- Send Button -->
  <rect x="615" y="54" width="80" height="24" rx="4" fill="#0284c7"/>
  <text x="655" y="70" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Send</text>

  <!-- Response Meta Banner -->
  <rect x="15" y="92" width="690" height="30" fill="#fffbeb" stroke="#fef3c7" stroke-width="1"/>
  <text x="25" y="112" fill="#92400e" font-family="sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.05em">GUARDED RESPONSE</text>
  
  <!-- Status Badge (400 Bad Request) -->
  <rect x="470" y="97" width="160" height="20" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="550" y="111" fill="#b45309" font-family="monospace" font-size="11" font-weight="800" text-anchor="middle">400 BAD REQUEST</text>
  
  <!-- Latency Badge -->
  <text x="690" y="111" fill="#16a34a" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">4 ms</text>
  
  <!-- Response JSON Stream Structured Guidance -->
  <g class="response-json-body">
    <text x="24" y="145" fill="#0f172a" font-family="monospace" font-size="12">{</text>
    <text x="24" y="170" fill="#0f172a" font-family="monospace" font-size="12">  &quot;error&quot;: &quot;BAD_REQUEST&quot;,</text>
    <text x="24" y="195" fill="#b45309" font-family="monospace" font-size="12">  &quot;message&quot;: &quot;The query parameter 'name' is mandatory. Example: ?name=north_loop&quot;,</text>
    <text x="24" y="220" fill="#0f172a" font-family="monospace" font-size="12">  &quot;status&quot;: 400,</text>
    <text x="24" y="245" fill="#0f172a" font-family="monospace" font-size="12">  &quot;timestamp&quot;: &quot;2026-09-29T20:33:04.112Z&quot;,</text>
    <text x="24" y="270" fill="#0f172a" font-family="monospace" font-size="12">  &quot;documentation&quot;: &quot;http://localhost:5050/docs/shuttle-api&quot;</text>
    <text x="24" y="295" fill="#0f172a" font-family="monospace" font-size="12">}</text>
  </g>

  <!-- Grounding Banner -->
  <rect x="15" y="340" width="690" height="42" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="25" y="365" fill="#065f46" font-family="sans-serif" font-size="11" font-weight="700">GUARD SUCCESS: Intercepted before calling .trim(). Server remains stable; client receives remediation.</text>
</svg>