<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="100%" height="100%" style="background:#FFFFFF;">
  <defs>
    <filter id="bubbleShadow2" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1B2A4A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean Pure White Background -->
  <rect width="1200" height="580" fill="#FFFFFF"/>

  <!-- Corridor Heritage Pillars and Archway -->
  <g stroke="#CBD5E1" stroke-width="2" fill="none">
    <rect x="80" y="80" width="70" height="440" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2.5"/>
    <line x1="80" y1="120" x2="150" y2="120" stroke="#94A3B8" stroke-width="2"/>
    <rect x="1050" y="80" width="70" height="440" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2.5"/>
    <line x1="1050" y1="120" x2="1120" y2="120" stroke="#94A3B8" stroke-width="2"/>
    <line x1="50" y1="520" x2="1150" y2="520" stroke="#94A3B8" stroke-width="3"/>
  </g>

  <!-- Akshay with Phone in Complete Distress (Left-Center) -->
  <g transform="translate(240, 180)">
    <!-- Akshay Legs -->
    <path d="M 50,220 L 35,320 L 65,320 L 75,245 L 85,320 L 115,320 L 100,220 Z" fill="#D97706" stroke="#92400E" stroke-width="3"/>
    <!-- Akshay Torso (Mustard Kurta) -->
    <path d="M 40,100 L 110,100 L 105,225 L 45,225 Z" fill="#F59E0B" stroke="#B45309" stroke-width="3"/>
    <!-- Head & Face -->
    <circle cx="75" cy="50" r="34" fill="#FDE68A" stroke="#92400E" stroke-width="3"/>
    <!-- Hair -->
    <path d="M 45,45 Q 55,15 85,18 Q 105,20 110,40 Q 95,30 75,30 Z" fill="#1E293B"/>
    <!-- Eyes looking down at phone -->
    <ellipse cx="65" cy="52" rx="6" ry="6" fill="#0F172A"/>
    <ellipse cx="88" cy="52" rx="6" ry="6" fill="#0F172A"/>
    <!-- Frustrated Wavy Mouth -->
    <path d="M 68,72 Q 78,65 88,72" stroke="#991B1B" stroke-width="3" fill="none"/>
    <!-- Sweat Drop -->
    <path d="M 108,45 Q 114,50 108,56 Q 102,50 108,45 Z" fill="#38BDF8"/>

    <!-- Arms holding Mobile Phone Up -->
    <path d="M 50,120 L 120,150 L 140,135" stroke="#B45309" stroke-width="10" fill="none" stroke-linecap="round"/>

    <!-- Giant Mobile Phone Displaying Crashed Portal -->
    <g transform="translate(130, 90)">
      <rect x="0" y="0" width="130" height="210" rx="14" fill="#0F172A" stroke="#334155" stroke-width="3" filter="url(#bubbleShadow2)"/>
      <rect x="6" y="16" width="118" height="175" rx="8" fill="#FFFFFF"/>
      <!-- Browser URL Bar -->
      <rect x="10" y="22" width="110" height="20" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <text x="16" y="36" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#64748B">portal.apex.edu</text>
      <!-- Infinite Spinner -->
      <circle cx="65" cy="95" r="24" fill="none" stroke="#E2E8F0" stroke-width="5"/>
      <path d="M 65,71 A 24 24 0 0 1 89,95" fill="none" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/>
      <text x="65" y="138" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#DC2626" text-anchor="middle">504 TIMEOUT</text>
      <text x="65" y="152" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#64748B" text-anchor="middle">Gateway Unavailable</text>
      <text x="65" y="176" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#D97706" text-anchor="middle">12,000 REQUESTS</text>
    </g>
  </g>

  <!-- Akshay Speech Bubble -->
  <g filter="url(#bubbleShadow2)" transform="translate(80, 20)">
    <path d="M 20,0 L 410,0 Q 430,0 430,20 L 430,110 Q 430,130 410,130 L 250,130 L 235,160 L 225,130 L 20,130 Q 0,130 0,110 L 0,20 Q 0,0 20,0 Z" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5"/>
    <text x="25" y="30" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#B45309">STUDENT AKSHAY (FRUSTRATED)</text>
    <text x="25" y="56" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0F172A">"I hit refresh twenty times on my phone!</text>
    <text x="25" y="78" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0F172A">The screen is locked on an endless white spinner!</text>
    <text x="25" y="100" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#DC2626">How can twelve thousand students bring down</text>
    <text x="25" y="120" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#DC2626">the entire university infrastructure?!"</text>
  </g>

  <!-- Sameer Walking in Calmly with Cutting Chai (Right-Center) -->
  <g transform="translate(760, 150)">
    <!-- Sameer Legs -->
    <path d="M 60,250 L 50,350 L 80,350 L 90,270 L 105,350 L 135,350 L 120,250 Z" fill="#334155" stroke="#0F172A" stroke-width="3"/>
    <!-- Sameer Torso (Navy Blue Linen Shirt) -->
    <path d="M 45,130 L 135,130 L 125,255 L 55,255 Z" fill="#1E3A8A" stroke="#0F172A" stroke-width="3"/>
    <!-- Sameer Head & Face (Calm, Knowing Smile) -->
    <circle cx="90" cy="75" r="36" fill="#FDE68A" stroke="#0F172A" stroke-width="3"/>
    <!-- Hair & Beard (Distinguished Short Hair) -->
    <path d="M 55,70 Q 65,35 95,35 Q 125,35 125,70 Q 115,55 95,55 Q 75,55 55,70 Z" fill="#334155"/>
    <path d="M 62,88 Q 90,118 118,88 Q 90,105 62,88 Z" fill="#475569"/>
    <!-- Calm Smiling Eyes & Glasses -->
    <rect x="70" y="65" width="18" height="14" rx="2" fill="none" stroke="#0F172A" stroke-width="2.5"/>
    <rect x="94" y="65" width="18" height="14" rx="2" fill="none" stroke="#0F172A" stroke-width="2.5"/>
    <line x1="88" y1="72" x2="94" y2="72" stroke="#0F172A" stroke-width="2.5"/>
    <circle cx="79" cy="72" r="3" fill="#0F172A"/>
    <circle cx="103" cy="72" r="3" fill="#0F172A"/>
    <!-- Calm Smile -->
    <path d="M 82,94 Q 91,102 100,94" stroke="#0F172A" stroke-width="2.5" fill="none"/>

    <!-- Right Arm Holding Steaming Steel Tumbler of Cutting Chai -->
    <path d="M 60,150 L 25,185 L 35,210" stroke="#1E3A8A" stroke-width="12" fill="none" stroke-linecap="round"/>
    <g transform="translate(20, 200)">
      <!-- Stainless Steel Chai Tumbler -->
      <polygon points="5,15 25,15 22,48 8,48" fill="#E2E8F0" stroke="#475569" stroke-width="2"/>
      <ellipse cx="15" cy="15" rx="10" ry="4" fill="#D97706" stroke="#475569" stroke-width="1.5"/>
      <!-- Steam Wisps -->
      <path d="M 12,10 Q 8,-5 14,-15 M 18,10 Q 22,-5 16,-18" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="35" y="32" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#B45309">HOT CUTTING CHAI</text>
    </g>

    <!-- Left Arm Pointing Away From Screen Towards Network Wire -->
    <path d="M 120,150 L 165,130 L 195,115" stroke="#1E3A8A" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- Pointing Finger -->
    <circle cx="200" cy="112" r="5" fill="#FDE68A"/>
  </g>

  <!-- Sameer Speech Bubble -->
  <g filter="url(#bubbleShadow2)" transform="translate(680, 20)">
    <path d="M 20,0 L 460,0 Q 480,0 480,20 L 480,120 Q 480,140 460,140 L 220,140 L 205,175 L 195,140 L 20,140 Q 0,140 0,120 L 0,20 Q 0,0 20,0 Z" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.5"/>
    <text x="25" y="30" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#15803D">SAMEER (PRINCIPAL ARCHITECT)</text>
    <text x="25" y="56" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0F172A">"Breathe, Akshay. Screaming at the browser</text>
    <text x="25" y="78" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0F172A">will not bring back a single admit card.</text>
    <text x="25" y="100" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#047857">The webpage is decorative glass choking on</text>
    <text x="25" y="122" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#065F46">heavy CSS, fonts and images. Watch the wire."</text>
  </g>

  <!-- Bottom Narration Caption -->
  <rect x="60" y="525" width="1080" height="42" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="80" y="551" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#334155"><tspan font-weight="800" fill="#0F172A">SCENE 2:</tspan> College Corridor · 08:38 AM · Sameer arrives with cutting chai as the browser chokes on decorative bloat.</text>
</svg>
