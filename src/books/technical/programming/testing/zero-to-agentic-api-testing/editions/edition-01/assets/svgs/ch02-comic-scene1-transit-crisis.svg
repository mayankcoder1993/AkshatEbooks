<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="100%" height="100%" style="background:#FFFFFF;">
  <defs>
    <filter id="ch02BubbleShadow1" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1B2A4A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean Pure White Background -->
  <rect width="1200" height="580" fill="#FFFFFF"/>

  <!-- War Room Console & Architecture -->
  <g stroke="#CBD5E1" stroke-width="2" fill="none">
    <line x1="50" y1="520" x2="1150" y2="520" stroke="#94A3B8" stroke-width="3"/>
  </g>

  <!-- Giant Wall Display Monitor (Left) Showing Frozen Transit Map -->
  <g transform="translate(80, 160)" filter="url(#ch02BubbleShadow1)">
    <!-- Monitor Bezel -->
    <rect x="0" y="0" width="560" height="340" rx="10" fill="#0F172A" stroke="#334155" stroke-width="3"/>
    <rect x="0" y="0" width="560" height="36" rx="10" fill="#1E293B"/>
    <text x="280" y="24" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#94A3B8" text-anchor="middle">CAMPUS TRANSIT TELEMETRY · 08:14 PM CRITICAL STANDOFF</text>

    <!-- Map Screen Area -->
    <rect x="15" y="48" width="530" height="275" rx="6" fill="#020617"/>

    <!-- Map Roads / Grid Lines -->
    <path d="M 40,120 L 500,120 M 40,200 L 500,200 M 150,60 L 150,290 M 360,60 L 360,290" stroke="#1E293B" stroke-width="4"/>

    <!-- Frozen Bus Markers -->
    <circle cx="150" cy="120" r="16" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/>
    <text x="150" y="125" font-family="Inter, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">BUS 1</text>
    <circle cx="360" cy="200" r="16" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/>
    <text x="360" y="205" font-family="Inter, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">BUS 4</text>

    <!-- Flashing Error Alert Banner -->
    <rect x="60" y="235" width="440" height="70" rx="8" fill="#450A0A" stroke="#DC2626" stroke-width="2"/>
    <text x="280" y="262" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#FCA5A5" text-anchor="middle">HTTP 500 INTERNAL SERVER ERROR</text>
    <text x="280" y="284" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#F87171" text-anchor="middle">GET /v1/shuttle/route?name= (Telemetry Service Down)</text>

    <!-- Clock Pill -->
    <rect x="440" y="58" width="90" height="24" rx="12" fill="#D9383A"/>
    <text x="485" y="74" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">08:14 PM</text>
  </g>

  <!-- Student Akshay at Workstation Terminal (Center Right) -->
  <g transform="translate(680, 220)">
    <!-- Akshay Torso (Mustard Kurta) -->
    <path d="M 35,90 L 105,90 L 100,210 L 40,210 Z" fill="#F59E0B" stroke="#B45309" stroke-width="3"/>
    <!-- Head & Face -->
    <circle cx="70" cy="45" r="32" fill="#FDE68A" stroke="#92400E" stroke-width="3"/>
    <!-- Hair -->
    <path d="M 40,40 Q 50,10 80,10 Q 100,10 105,35 Q 90,25 70,25 Z" fill="#1E293B"/>
    <!-- Focused Determined Eyes -->
    <ellipse cx="60" cy="46" rx="5" ry="6" fill="#0F172A"/>
    <ellipse cx="82" cy="46" rx="5" ry="6" fill="#0F172A"/>
    <circle cx="58" cy="44" r="2" fill="#FFFFFF"/>
    <circle cx="80" cy="44" r="2" fill="#FFFFFF"/>
    <!-- Determined Mouth -->
    <line x1="62" y1="64" x2="80" y2="64" stroke="#991B1B" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Arm Typing at Laptop -->
    <path d="M 45,115 L -20,135 L 20,150" stroke="#B45309" stroke-width="10" fill="none" stroke-linecap="round"/>
    <rect x="-35" y="130" width="55" height="40" rx="3" fill="#334155" stroke="#0F172A" stroke-width="2"/>
  </g>

  <!-- Akshay Speech Bubble -->
  <g filter="url(#ch02BubbleShadow1)" transform="translate(80, 20)">
    <path d="M 20,0 L 460,0 Q 480,0 480,20 L 480,105 Q 480,125 460,125 L 360,125 L 380,155 L 390,125 L 20,125 Q 0,125 0,105 L 0,20 Q 0,0 20,0 Z" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5"/>
    <text x="25" y="30" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#B45309">STUDENT AKSHAY (INVESTIGATING)</text>
    <text x="25" y="56" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0F172A">"The campus transit shuttle map has frozen!</text>
    <text x="25" y="78" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Students waiting at bus stops see an empty screen.</text>
    <text x="25" y="100" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#DC2626">The terminal log says HTTP 500 Internal Server Error!"</text>
  </g>

  <!-- Sameer Mentoring with Hot Chai Tumbler (Right) -->
  <g transform="translate(940, 210)">
    <!-- Sameer Torso (Indigo Blue Shirt) -->
    <path d="M 40,90 L 120,90 L 110,210 L 45,210 Z" fill="#1E3A8A" stroke="#0F172A" stroke-width="3"/>
    <!-- Head & Face -->
    <circle cx="80" cy="45" r="32" fill="#FDE68A" stroke="#0F172A" stroke-width="3"/>
    <!-- Hair & Beard -->
    <path d="M 50,40 Q 60,10 85,10 Q 110,10 110,40 Q 100,28 80,28 Q 65,28 50,40 Z" fill="#334155"/>
    <path d="M 55,55 Q 80,82 105,55 Q 80,72 55,55 Z" fill="#475569"/>
    <!-- Spectacles -->
    <rect x="62" y="38" width="16" height="12" rx="2" fill="none" stroke="#0F172A" stroke-width="2"/>
    <rect x="84" y="38" width="16" height="12" rx="2" fill="none" stroke="#0F172A" stroke-width="2"/>
    <line x1="78" y1="44" x2="84" y2="44" stroke="#0F172A" stroke-width="2"/>
    <!-- Calm Smile -->
    <path d="M 72,60 Q 80,68 88,60" stroke="#0F172A" stroke-width="2" fill="none"/>

    <!-- Left Arm Holding Brass Chai Tumbler -->
    <path d="M 45,110 L 15,140 L 25,160" stroke="#1E3A8A" stroke-width="10" fill="none" stroke-linecap="round"/>
    <g transform="translate(10, 155)">
      <polygon points="5,15 25,15 22,48 8,48" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
      <ellipse cx="15" cy="15" rx="10" ry="4" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>
      <path d="M 12,10 Q 8,-5 14,-15 M 18,10 Q 22,-5 16,-18" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Right Arm Pointing towards Screen -->
    <path d="M 115,110 L 150,110 L 170,115" stroke="#1E3A8A" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Sameer Speech Bubble -->
  <g filter="url(#ch02BubbleShadow1)" transform="translate(680, 20)">
    <path d="M 20,0 L 480,0 Q 500,0 500,20 L 500,105 Q 500,125 480,125 L 260,125 L 245,155 L 235,125 L 20,125 Q 0,125 0,105 L 0,20 Q 0,0 20,0 Z" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.5"/>
    <text x="25" y="30" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#15803D">SAMEER (CALM MENTOR)</text>
    <text x="25" y="56" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0F172A">"An HTTP 500 is the server throwing its hands up.</text>
    <text x="25" y="78" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0F172A">It crashed because of an unhandled runtime error.</text>
    <text x="25" y="100" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#047857">Do not guess. Replay the request and inspect the wire."</text>
  </g>

  <!-- Bottom Narration Caption -->
  <rect x="60" y="525" width="1080" height="42" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="80" y="551" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#334155"><tspan font-weight="800" fill="#0F172A">SCENE 1:</tspan> Campus Transit Operations · 08:14 PM · Akshay and Sameer investigate the unhandled 500 telemetry crash.</text>
</svg>
