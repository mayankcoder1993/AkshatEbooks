<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 146" width="100%" class="svg-terminal-screen">
  <!-- Window Container -->
  <rect x="0" y="0" width="720" height="146" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Titlebar Header -->
  <path d="M 0 10 Q 0 0 10 0 L 710 0 Q 720 0 720 10 L 720 38 L 0 38 Z" fill="#f8fafc"/>
  <line x1="0" y1="38" x2="720" y2="38" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Traffic Light Window Controls -->
  <circle cx="22" cy="19" r="5" fill="#ef4444"/>
  <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
  <circle cx="50" cy="19" r="5" fill="#10b981"/>
  <text x="70" y="23" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="700">TERMINAL</text>
  
  <!-- Prompt & Executed Command -->
  <g class="terminal-command">
    <text x="24" y="58" fill="#0284c7" font-family="monospace" font-size="13" font-weight="800">$</text>
    <text x="40" y="58" fill="#0f172a" font-family="monospace" font-size="13" font-weight="700">node server.js</text>
  </g>
  
  <!-- Output Stream -->
  <g class="terminal-stdout">
    <text x="24" y="80" fill="#334155" font-family="monospace" font-size="12.5">Catalog service listening on port 3000</text><text x="24" y="102" fill="#334155" font-family="monospace" font-size="12.5">Incoming TCP connection from 127.0.0.1:54218</text><text x="24" y="124" fill="#334155" font-family="monospace" font-size="12.5">HTTP/1.1 POST /catalog 201 Created (24 ms)</text>
  </g>
</svg>