<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="100%" height="100%">
  <defs>
    <filter id="sameerPointShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Grounding Glow -->
  <circle cx="160" cy="220" r="130" fill="#ECFDF5" opacity="0.6"/>

  <g filter="url(#sameerPointShadow)" transform="translate(30, 20)">
    <!-- Indigo Kurta Body -->
    <path d="M 70,160 L 190,160 L 205,340 L 55,340 Z" fill="#1E3A8A" stroke="#0F172A" stroke-width="4"/>
    <!-- Gold Placket -->
    <path d="M 120,160 L 140,160 L 135,230 L 125,230 Z" fill="#D97706" stroke="#92400E" stroke-width="2"/>

    <!-- Left Arm Resting on Hip -->
    <path d="M 75,170 L 40,220 L 60,250" stroke="#1E3A8A" stroke-width="18" stroke-linecap="round" fill="none"/>
    <circle cx="62" cy="255" r="10" fill="#FDE68A" stroke="#92400E" stroke-width="2"/>

    <!-- Right Arm Extended, Pointing Index Finger Leftward at Code -->
    <path d="M 185,175 L 230,195 L 265,190" stroke="#1E3A8A" stroke-width="18" stroke-linecap="round" fill="none"/>
    <!-- Hand with Pointing Finger -->
    <circle cx="270" cy="190" r="11" fill="#FDE68A" stroke="#92400E" stroke-width="2"/>
    <path d="M 275,188 L 295,185" stroke="#92400E" stroke-width="5" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="115" y="130" width="30" height="35" fill="#FDE68A" stroke="#92400E" stroke-width="3"/>

    <!-- Head & Face -->
    <ellipse cx="130" cy="95" rx="38" ry="44" fill="#FDE68A" stroke="#0F172A" stroke-width="4"/>

    <!-- Hair (Salt-and-Pepper) -->
    <path d="M 92,90 C 90,50 110,40 130,40 C 155,40 170,50 168,90 C 160,60 145,55 130,55 C 115,55 100,62 92,90 Z" fill="#1E293B"/>
    <path d="M 105,50 Q 115,44 125,50" stroke="#94A3B8" stroke-width="2" fill="none"/>
    <path d="M 135,50 Q 145,44 155,50" stroke="#94A3B8" stroke-width="2" fill="none"/>

    <!-- Beard & Mustache -->
    <path d="M 100,105 C 100,135 120,148 130,148 C 140,148 160,135 160,105 C 150,118 140,122 130,122 C 120,122 110,118 100,105 Z" fill="#1E293B"/>
    <path d="M 108,125 Q 130,140 152,125" stroke="#94A3B8" stroke-width="2.5" fill="none"/>

    <!-- Eyes (Teaching Focus) -->
    <ellipse cx="116" cy="92" rx="7" ry="4" fill="#0F172A"/>
    <ellipse cx="144" cy="92" rx="7" ry="4" fill="#0F172A"/>
    <circle cx="114" cy="91" r="1.5" fill="#FFFFFF"/>
    <circle cx="142" cy="91" r="1.5" fill="#FFFFFF"/>

    <!-- Spectacles -->
    <circle cx="116" cy="92" r="14" fill="none" stroke="#D97706" stroke-width="2.5"/>
    <circle cx="144" cy="92" r="14" fill="none" stroke="#D97706" stroke-width="2.5"/>
    <line x1="130" y1="92" x2="130" y2="92" stroke="#D97706" stroke-width="3"/>
  </g>

  <!-- Tag -->
  <rect x="70" y="365" width="180" height="26" rx="13" fill="#065F46"/>
  <text x="160" y="382" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">SAMEER · SENIOR SAVIOR</text>
</svg>
