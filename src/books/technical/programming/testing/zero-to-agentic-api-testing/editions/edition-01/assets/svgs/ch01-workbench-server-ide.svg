<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" width="100%" class="svg-ide-screen">
  <!-- Window Container -->
  <rect x="0" y="0" width="720" height="620" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Titlebar Header -->
  <path d="M 0 10 Q 0 0 10 0 L 710 0 Q 720 0 720 10 L 720 38 L 0 38 Z" fill="#f8fafc"/>
  <line x1="0" y1="38" x2="720" y2="38" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Traffic Light Window Controls -->
  <circle cx="22" cy="19" r="5" fill="#ef4444"/>
  <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
  <circle cx="50" cy="19" r="5" fill="#10b981"/>
  
  <!-- Tab / Filename -->
  <rect x="70" y="8" width="130" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="82" y="24" fill="#0f172a" font-family="monospace" font-size="12" font-weight="700">📄 server.js</text>
  
  <!-- Status Indicator Badge -->
  <rect x="570" y="9" width="135" height="20" rx="10" fill="rgba(16, 185, 129, 0.15)"/>
  <circle cx="582" cy="19" r="3.5" fill="#10b981"/>
  <text x="594" y="23" fill="#065f46" font-family="sans-serif" font-size="10.5" font-weight="700">Active · Port 3000</text>
  
  <!-- Code Area -->
  <g class="code-stream">
    
      
      <text x="24" y="60" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600"> 1</text>
      <text x="56" y="60" fill="#1e293b" font-family="monospace" font-size="13">const express = require(&quot;express&quot;);</text>
    
      
      <text x="24" y="82" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600"> 2</text>
      <text x="56" y="82" fill="#1e293b" font-family="monospace" font-size="13">const app = express();</text>
    
      
      <text x="24" y="104" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600"> 3</text>
      <text x="56" y="104" fill="#1e293b" font-family="monospace" font-size="13">const PORT = 3000;</text>
    
      
      <text x="24" y="126" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600"> 4</text>
      <text x="56" y="126" fill="#1e293b" font-family="monospace" font-size="13"></text>
    
      
      <text x="24" y="148" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600"> 5</text>
      <text x="56" y="148" fill="#1e293b" font-family="monospace" font-size="13">// Mandatory middleware: buffer readable stream into req.body</text>
    
      <rect x="10" y="155" width="700" height="22" fill="rgba(14, 165, 233, 0.12)" rx="4"/>
      <text x="24" y="170" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600"> 6</text>
      <text x="56" y="170" fill="#1e293b" font-family="monospace" font-size="13">app.use(express.json());</text>
    
      
      <text x="24" y="192" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600"> 7</text>
      <text x="56" y="192" fill="#1e293b" font-family="monospace" font-size="13"></text>
    
      
      <text x="24" y="214" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600"> 8</text>
      <text x="56" y="214" fill="#1e293b" font-family="monospace" font-size="13">let catalog = [</text>
    
      
      <text x="24" y="236" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600"> 9</text>
      <text x="56" y="236" fill="#1e293b" font-family="monospace" font-size="13">  { id: 101, title: &quot;Computer Science 101&quot;, seats: 45 },</text>
    
      
      <text x="24" y="258" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600">10</text>
      <text x="56" y="258" fill="#1e293b" font-family="monospace" font-size="13">  { id: 102, title: &quot;Data Structures&quot;, seats: 30 }</text>
    
      
      <text x="24" y="280" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600">11</text>
      <text x="56" y="280" fill="#1e293b" font-family="monospace" font-size="13">];</text>
    
      
      <text x="24" y="302" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600">12</text>
      <text x="56" y="302" fill="#1e293b" font-family="monospace" font-size="13"></text>
    
      
      <text x="24" y="324" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600">13</text>
      <text x="56" y="324" fill="#1e293b" font-family="monospace" font-size="13">// GET /catalog: safe and idempotent query</text>
    
      
      <text x="24" y="346" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600">14</text>
      <text x="56" y="346" fill="#1e293b" font-family="monospace" font-size="13">app.get(&quot;/catalog&quot;, (req, res) =&gt; {</text>
    
      
      <text x="24" y="368" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600">15</text>
      <text x="56" y="368" fill="#1e293b" font-family="monospace" font-size="13">  res.status(200).json(catalog);</text>
    
      
      <text x="24" y="390" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600">16</text>
      <text x="56" y="390" fill="#1e293b" font-family="monospace" font-size="13">});</text>
    
      
      <text x="24" y="412" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600">17</text>
      <text x="56" y="412" fill="#1e293b" font-family="monospace" font-size="13"></text>
    
      
      <text x="24" y="434" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600">18</text>
      <text x="56" y="434" fill="#1e293b" font-family="monospace" font-size="13">// POST /catalog: create new record</text>
    
      
      <text x="24" y="456" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600">19</text>
      <text x="56" y="456" fill="#1e293b" font-family="monospace" font-size="13">app.post(&quot;/catalog&quot;, (req, res) =&gt; {</text>
    
      
      <text x="24" y="478" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600">20</text>
      <text x="56" y="478" fill="#1e293b" font-family="monospace" font-size="13">  const newCourse = { id: catalog.length + 101, ...req.body };</text>
    
      
      <text x="24" y="500" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600">21</text>
      <text x="56" y="500" fill="#1e293b" font-family="monospace" font-size="13">  catalog.push(newCourse);</text>
    
      
      <text x="24" y="522" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600">22</text>
      <text x="56" y="522" fill="#1e293b" font-family="monospace" font-size="13">  res.status(201).json(newCourse);</text>
    
      
      <text x="24" y="544" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600">23</text>
      <text x="56" y="544" fill="#1e293b" font-family="monospace" font-size="13">});</text>
    
      
      <text x="24" y="566" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600">24</text>
      <text x="56" y="566" fill="#1e293b" font-family="monospace" font-size="13"></text>
    
      
      <text x="24" y="588" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600">25</text>
      <text x="56" y="588" fill="#1e293b" font-family="monospace" font-size="13">app.listen(PORT, () =&gt; console.log(`Catalog service listening on port ${PORT}`));</text>
    
  </g>
</svg>