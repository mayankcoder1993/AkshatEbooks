<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 395" width="100%" class="svg-api-workbench">
  <!-- Outer Window Frame -->
  <rect x="0" y="0" width="720" height="395" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Titlebar Header -->
  <path d="M 0 10 Q 0 0 10 0 L 710 0 Q 720 0 720 10 L 720 38 L 0 38 Z" fill="#f8fafc"/>
  <line x1="0" y1="38" x2="720" y2="38" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Traffic Light Window Controls -->
  <circle cx="22" cy="19" r="5" fill="#ef4444"/>
  <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
  <circle cx="50" cy="19" r="5" fill="#10b981"/>
  <text x="70" y="23" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="700">API TESTING WORKBENCH</text>

  <!-- Request Address Bar Box -->
  <rect x="15" y="48" width="690" height="36" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  
  <!-- HTTP Method Badge -->
  <rect x="22" y="54" width="56" height="24" rx="4" fill="#0284c7"/>
  <text x="50" y="70" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">GET</text>
  
  <!-- Target URL String -->
  <text x="88" y="71" fill="#0f172a" font-family="monospace" font-size="12" font-weight="600">http://localhost:3000/api/v1/admitcards/APX102</text>
  
  <!-- Response Meta Banner -->
  <rect x="15" y="92" width="690" height="30" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="25" y="112" fill="#64748b" font-family="sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.05em">RESPONSE BODY</text>
  
  <!-- Status Badge -->
  <rect x="550" y="97" width="90" height="20" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
  <text x="595" y="111" fill="#065f46" font-family="monospace" font-size="11" font-weight="800" text-anchor="middle">200 OK</text>
  
  <!-- Latency Badge -->
  <text x="690" y="111" fill="#047857" font-family="monospace" font-size="11" font-weight="800" text-anchor="end">14 ms</text>
  
  <!-- Response JSON Stream -->
  <g class="response-json-body">
    <text x="24" y="145" fill="#0f172a" font-family="monospace" font-size="12">{</text>
    <text x="44" y="168" fill="#0f172a" font-family="monospace" font-size="12">&quot;status&quot;: &quot;CONFIRMED&quot;,</text>
    <text x="44" y="191" fill="#0f172a" font-family="monospace" font-size="12">&quot;regNo&quot;: &quot;APX102&quot;,</text>
    <text x="44" y="214" fill="#0f172a" font-family="monospace" font-size="12">&quot;studentName&quot;: &quot;Akshay&quot;,</text>
    <text x="44" y="237" fill="#0f172a" font-family="monospace" font-size="12">&quot;examCenter&quot;: &quot;Apex Main Hall&quot;,</text>
    <text x="44" y="260" fill="#047857" font-family="monospace" font-size="12" font-weight="700">&quot;hallNumber&quot;: &quot;302&quot;,</text>
    <text x="44" y="283" fill="#047857" font-family="monospace" font-size="12" font-weight="700">&quot;seatNumber&quot;: &quot;B-14&quot;,</text>
    <text x="44" y="306" fill="#0f172a" font-family="monospace" font-size="12">&quot;examDate&quot;: &quot;2026-10-01T09:00:00Z&quot;</text>
    <text x="24" y="329" fill="#0f172a" font-family="monospace" font-size="12">}</text>
  </g>
</svg>