<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Why Was Python Needed?</title>
  <desc id="desc">Three steps show the original programming problem, Python's practical answer, and later application areas.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#197b83"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#172b4d" flood-opacity=".12"/></filter>
    <style>
      .navy{fill:#172b4d}.teal{fill:#197b83}.gold{fill:#c58b22}.red{fill:#b83a3a}.muted{fill:#506174}
      .h1{font-family:Arial,sans-serif;font-size:54px;font-weight:700}.step{font-family:Arial,sans-serif;font-size:27px;font-weight:700;letter-spacing:1px}.label{font-family:Arial,sans-serif;font-size:25px;font-weight:700}.body{font-family:Arial,sans-serif;font-size:20px;font-weight:400}.small{font-family:Arial,sans-serif;font-size:18px;font-weight:600}.chip{font-family:Arial,sans-serif;font-size:17px;font-weight:700}.outcome{font-family:Arial,sans-serif;font-size:19px;font-weight:700}
    </style>
  </defs>
  <rect width="1536" height="1024" fill="#fbf8f0"/>
  <text x="768" y="74" text-anchor="middle" class="h1 navy">Why Was Python Needed?</text>
  <path d="M505 93H1031" stroke="#b83a3a" stroke-width="7"/>

  <!-- Step 1 -->
  <circle cx="246" cy="146" r="38" fill="#172b4d"/><circle cx="246" cy="146" r="43" fill="none" stroke="#b83a3a" stroke-width="4"/>
  <text x="246" y="158" text-anchor="middle" font-family="Arial" font-size="35" font-weight="700" fill="white">1</text>
  <text x="246" y="221" text-anchor="middle" class="step navy">THE PROBLEM</text>
  <text x="246" y="257" text-anchor="middle" class="body muted">Two useful routes had a gap between them.</text>

  <g filter="url(#shadow)"><rect x="36" y="292" width="205" height="355" rx="22" fill="white" stroke="#d8d1c3" stroke-width="2"/></g>
  <rect x="70" y="335" width="137" height="108" rx="12" fill="#172b4d"/>
  <circle cx="91" cy="354" r="6" fill="#b83a3a"/><circle cx="110" cy="354" r="6" fill="#c58b22"/><circle cx="129" cy="354" r="6" fill="#70b7b4"/>
  <path d="M98 382l25 20-25 20M134 423h35" fill="none" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="138" y="491" text-anchor="middle" class="label navy">Shell scripts</text>
  <text x="138" y="531" text-anchor="middle" class="body muted"><tspan x="138">Quick for small</tspan><tspan x="138" dy="27">system tasks</tspan></text>
  <path d="M72 581H204" stroke="#c58b22" stroke-width="3"/>
  <text x="138" y="610" text-anchor="middle" class="small gold">Harder to grow</text>

  <g filter="url(#shadow)"><rect x="263" y="292" width="205" height="355" rx="22" fill="white" stroke="#d8d1c3" stroke-width="2"/></g>
  <path d="M316 330h89l27 27v104H299V347a17 17 0 0117-17z" fill="#eef2f2" stroke="#172b4d" stroke-width="5"/>
  <path d="M405 330v29h27" fill="none" stroke="#172b4d" stroke-width="5"/>
  <path d="M320 374h62M320 397h85M320 420h51" stroke="#197b83" stroke-width="7" stroke-linecap="round"/>
  <circle cx="400" cy="442" r="34" fill="#172b4d"/><text x="400" y="454" text-anchor="middle" font-family="Arial" font-size="37" font-weight="700" fill="white">C</text>
  <text x="365" y="491" text-anchor="middle" class="label navy">C programs</text>
  <text x="365" y="531" text-anchor="middle" class="body muted"><tspan x="365">Control and</tspan><tspan x="365" dy="27">speed</tspan></text>
  <path d="M299 581H431" stroke="#c58b22" stroke-width="3"/>
  <text x="365" y="601" text-anchor="middle" class="small gold"><tspan x="365">More code for</tspan><tspan x="365" dy="22">small tools</tspan></text>

  <path d="M488 469H542" stroke="#197b83" stroke-width="8" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <circle cx="768" cy="146" r="38" fill="#172b4d"/><circle cx="768" cy="146" r="43" fill="none" stroke="#b83a3a" stroke-width="4"/>
  <text x="768" y="158" text-anchor="middle" font-family="Arial" font-size="35" font-weight="700" fill="white">2</text>
  <text x="768" y="221" text-anchor="middle" class="step navy">PYTHON’S ANSWER</text>
  <text x="768" y="257" text-anchor="middle" class="body muted">A practical middle path for many everyday programs.</text>

  <g filter="url(#shadow)"><rect x="555" y="292" width="426" height="355" rx="22" fill="white" stroke="#d8d1c3" stroke-width="2"/></g>
  <path d="M609 335h132l31 31v188H584V360a25 25 0 0125-25z" fill="#f3f7f5" stroke="#197b83" stroke-width="5"/>
  <path d="M741 335v34h31" fill="none" stroke="#197b83" stroke-width="5"/>
  <path d="M620 394h96M620 425h120M620 456h78M620 487h105" stroke="#506174" stroke-width="7" stroke-linecap="round"/>
  <rect x="624" y="576" width="109" height="38" rx="19" fill="#197b83"/><text x="679" y="602" text-anchor="middle" class="small" fill="white">PYTHON</text>

  <rect x="800" y="342" width="145" height="65" rx="13" fill="#172b4d"/><circle cx="817" cy="360" r="6" fill="#b83a3a"/><text x="873" y="382" text-anchor="middle" class="chip" fill="white">Readable code</text>
  <rect x="800" y="430" width="145" height="65" rx="13" fill="#172b4d"/><circle cx="817" cy="448" r="6" fill="#b83a3a"/><text x="873" y="458" text-anchor="middle" class="chip" fill="white"><tspan x="873">Reusable</tspan><tspan x="873" dy="22">modules</tspan></text>
  <rect x="800" y="518" width="145" height="82" rx="13" fill="#172b4d"/><circle cx="817" cy="536" r="6" fill="#b83a3a"/><text x="873" y="551" text-anchor="middle" class="chip" fill="white"><tspan x="873">Connects to</tspan><tspan x="873" dy="22">existing tools</tspan></text>

  <path d="M1000 469H1050" stroke="#197b83" stroke-width="8" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <circle cx="1275" cy="146" r="38" fill="#172b4d"/><circle cx="1275" cy="146" r="43" fill="none" stroke="#b83a3a" stroke-width="4"/>
  <text x="1275" y="158" text-anchor="middle" font-family="Arial" font-size="35" font-weight="700" fill="white">3</text>
  <text x="1275" y="221" text-anchor="middle" class="step navy">WHAT IT UNLOCKED</text>
  <text x="1275" y="257" text-anchor="middle" class="body muted">One language, many later applications.</text>

  <circle cx="1123" cy="469" r="67" fill="#197b83" filter="url(#shadow)"/>
  <text x="1123" y="458" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="white">PYTHON</text>
  <text x="1123" y="489" text-anchor="middle" font-family="Arial" font-size="19" fill="white">ecosystem</text>

  <path d="M1189 438C1228 350 1250 331 1290 331M1190 450C1240 411 1256 409 1290 409M1190 469H1290M1190 489C1240 527 1256 529 1290 529M1189 501C1228 590 1250 607 1290 607" fill="none" stroke="#197b83" stroke-width="5"/>

  <g filter="url(#shadow)">
    <rect x="1310" y="296" width="190" height="70" rx="18" fill="white" stroke="#d8d1c3"/><rect x="1310" y="374" width="190" height="70" rx="18" fill="white" stroke="#d8d1c3"/><rect x="1310" y="452" width="190" height="70" rx="18" fill="white" stroke="#d8d1c3"/><rect x="1310" y="530" width="190" height="70" rx="18" fill="white" stroke="#d8d1c3"/><rect x="1310" y="608" width="190" height="70" rx="18" fill="white" stroke="#d8d1c3"/>
  </g>
  <!-- automation gear -->
  <circle cx="1344" cy="331" r="17" fill="none" stroke="#c58b22" stroke-width="7"/><circle cx="1344" cy="331" r="5" fill="#c58b22"/>
  <text x="1368" y="339" class="outcome navy">Automation</text>
  <!-- web globe -->
  <circle cx="1344" cy="409" r="18" fill="none" stroke="#197b83" stroke-width="4"/><path d="M1326 409h36M1344 391c-9 9-9 27 0 36M1344 391c9 9 9 27 0 36" fill="none" stroke="#197b83" stroke-width="3"/>
  <text x="1368" y="417" class="outcome navy">Web backends</text>
  <!-- data bars -->
  <rect x="1326" y="484" width="9" height="21" fill="#197b83"/><rect x="1340" y="475" width="9" height="30" fill="#c58b22"/><rect x="1354" y="462" width="9" height="43" fill="#172b4d"/>
  <text x="1368" y="495" class="outcome navy">Data</text>
  <!-- science flask -->
  <path d="M1338 547v13l-15 24c-5 8 1 12 8 12h27c7 0 13-4 8-12l-15-24v-13M1334 547h21M1331 582h27" fill="none" stroke="#197b83" stroke-width="4" stroke-linecap="round"/>
  <text x="1368" y="573" class="outcome navy">Science</text>
  <!-- AI network -->
  <circle cx="1328" cy="629" r="6" fill="#b83a3a"/><circle cx="1358" cy="622" r="6" fill="#197b83"/><circle cx="1358" cy="652" r="6" fill="#c58b22"/><circle cx="1328" cy="659" r="6" fill="#172b4d"/><path d="M1334 629l18-6M1334 633l18 15M1334 656l18-4M1331 635v18" stroke="#506174" stroke-width="3"/>
  <text x="1368" y="651" class="outcome navy">AI</text>

  <!-- precise takeaway -->
  <rect x="0" y="844" width="1536" height="180" fill="#172b4d"/>
  <text x="768" y="911" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="white">A clearer way to build useful programs</text>
  <text x="768" y="957" text-anchor="middle" font-family="Arial" font-size="25" fill="#f2c566">without giving up access to powerful tools.</text>
</svg>
