<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">What can Python help build?</title>
  <desc id="desc">Python and additional libraries can support automation, web backends, data work, science and artificial intelligence.</desc>
  <defs><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#172b4d" flood-opacity=".13"/></filter></defs>
  <rect width="1200" height="440" fill="#fbf8f0"/>
  <text x="600" y="60" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#172b4d">What can Python help build?</text>
  <text x="600" y="101" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#506174">The language grows through its standard library and additional packages.</text>

  <g filter="url(#shadow)">
    <rect x="28" y="142" width="215" height="205" rx="22" fill="white" stroke="#d8d1c3" stroke-width="2"/>
    <rect x="260" y="142" width="215" height="205" rx="22" fill="white" stroke="#d8d1c3" stroke-width="2"/>
    <rect x="492" y="142" width="215" height="205" rx="22" fill="white" stroke="#d8d1c3" stroke-width="2"/>
    <rect x="724" y="142" width="215" height="205" rx="22" fill="white" stroke="#d8d1c3" stroke-width="2"/>
    <rect x="956" y="142" width="215" height="205" rx="22" fill="white" stroke="#d8d1c3" stroke-width="2"/>
  </g>

  <!-- Automation -->
  <circle cx="136" cy="217" r="39" fill="none" stroke="#c58b22" stroke-width="12"/><circle cx="136" cy="217" r="12" fill="#c58b22"/>
