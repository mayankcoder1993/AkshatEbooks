  <path d="M815 169v54l-47 72c-9 14 1 24 18 24h92c17 0 27-10 18-24l-47-72v-54M802 169h60M791 273h82" fill="none" stroke="#197b83" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
