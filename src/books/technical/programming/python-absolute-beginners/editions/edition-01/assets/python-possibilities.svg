  <rect x="0" y="383" width="1200" height="57" fill="#172b4d"/>
  <text x="600" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="white">Learn the language first. Add specialized tools when a project needs them.</text>
