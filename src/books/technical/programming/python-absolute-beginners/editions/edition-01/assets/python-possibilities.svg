  <text x="136" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#172b4d">Automation</text>

  <!-- Web -->
  <circle cx="368" cy="217" r="48" fill="none" stroke="#197b83" stroke-width="7"/><path d="M320 217h96M368 169c-24 25-24 71 0 96M368 169c24 25 24 71 0 96M327 193h82M327 241h82" fill="none" stroke="#197b83" stroke-width="5"/>
