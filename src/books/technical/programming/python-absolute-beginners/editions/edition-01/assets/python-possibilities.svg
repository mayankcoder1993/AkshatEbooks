  <circle cx="1007" cy="183" r="12" fill="#b83a3a"/><circle cx="1114" cy="183" r="12" fill="#197b83"/><circle cx="1060" cy="222" r="12" fill="#c58b22"/><circle cx="1007" cy="261" r="12" fill="#172b4d"/><circle cx="1114" cy="261" r="12" fill="#c58b22"/>
