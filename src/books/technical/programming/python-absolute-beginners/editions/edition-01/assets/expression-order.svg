<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <rect width="1200" height="600" fill="#fbf8f1"/>
  <text x="600" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#1b3155">Parentheses change the route</text>
  <g font-family="Arial, sans-serif">
    <rect x="45" y="110" width="535" height="425" rx="22" fill="#ffffff" stroke="#d7d0c2" stroke-width="2"/>
    <text x="312" y="160" text-anchor="middle" font-size="25" font-weight="700" fill="#bf3e3e">WITHOUT PARENTHESES</text>
    <text x="312" y="220" text-anchor="middle" font-family="Courier New, monospace" font-size="34" font-weight="700" fill="#1b3155">2 + 10 * 10 + 3</text>
    <circle cx="115" cy="295" r="29" fill="#bf3e3e"/><text x="115" y="305" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">1</text>
    <text x="165" y="305" font-size="27" fill="#1b3155">Multiply: 10 * 10 = 100</text>
    <circle cx="115" cy="370" r="29" fill="#bf3e3e"/><text x="115" y="380" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">2</text>
    <text x="165" y="380" font-size="27" fill="#1b3155">Add: 2 + 100 + 3</text>
    <text x="312" y="475" text-anchor="middle" font-size="44" font-weight="700" fill="#bf3e3e">Result: 105</text>

    <rect x="620" y="110" width="535" height="425" rx="22" fill="#ffffff" stroke="#d7d0c2" stroke-width="2"/>
    <text x="887" y="160" text-anchor="middle" font-size="25" font-weight="700" fill="#1b8790">WITH PARENTHESES</text>
    <text x="887" y="220" text-anchor="middle" font-family="Courier New, monospace" font-size="31" font-weight="700" fill="#1b3155">(2 + 10) * (10 + 3)</text>
    <circle cx="690" cy="295" r="29" fill="#1b8790"/><text x="690" y="305" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">1</text>
    <text x="740" y="305" font-size="27" fill="#1b3155">Groups: 12 and 13</text>
    <circle cx="690" cy="370" r="29" fill="#1b8790"/><text x="690" y="380" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">2</text>
    <text x="740" y="380" font-size="27" fill="#1b3155">Multiply: 12 * 13</text>
    <text x="887" y="475" text-anchor="middle" font-size="44" font-weight="700" fill="#1b8790">Result: 156</text>
  </g>
  <text x="600" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#52647c">Use parentheses when they make your intended calculation easier to see.</text>
</svg>
