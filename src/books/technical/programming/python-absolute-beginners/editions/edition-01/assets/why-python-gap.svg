<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Why was Python needed?</title>
  <desc id="desc">Shell scripts were quick for small tasks, while C offered control but often needed more code. Python provided a readable middle path that could connect to existing tools.</desc>
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#172b4d" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11Z" fill="#197b83"/></marker>
  </defs>
  <rect width="1200" height="600" fill="#fbf8f0"/>
  <text x="600" y="64" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#172b4d">Why was Python needed?</text>
  <text x="280" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#b83a3a">THE GAP</text>
  <text x="882" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#197b83">PYTHON'S ANSWER</text>

  <g filter="url(#shadow)"><rect x="38" y="150" width="235" height="350" rx="22" fill="white" stroke="#d8d1c3" stroke-width="2"/></g>
  <rect x="89" y="187" width="132" height="101" rx="12" fill="#172b4d"/>
  <circle cx="108" cy="206" r="6" fill="#b83a3a"/><circle cx="127" cy="206" r="6" fill="#c58b22"/><circle cx="146" cy="206" r="6" fill="#70b7b4"/>
  <path d="M114 232l24 18-24 18M150 269h35" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="156" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#172b4d">Shell scripts</text>
  <text x="156" y="386" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#506174"><tspan x="156">Quick for small</tspan><tspan x="156" dy="31">system tasks</tspan></text>
  <line x1="82" y1="446" x2="230" y2="446" stroke="#c58b22" stroke-width="3"/>
  <text x="156" y="477" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#a66e0c">Harder to grow</text>

  <g filter="url(#shadow)"><rect x="292" y="150" width="235" height="350" rx="22" fill="white" stroke="#d8d1c3" stroke-width="2"/></g>
  <path d="M355 187h100l27 27v98H333V209a22 22 0 0122-22z" fill="#eef4f2" stroke="#172b4d" stroke-width="5"/>
  <path d="M455 187v29h27" fill="none" stroke="#172b4d" stroke-width="5"/>
  <path d="M358 232h67M358 259h91M358 286h55" stroke="#197b83" stroke-width="7" stroke-linecap="round"/>
  <circle cx="454" cy="294" r="31" fill="#172b4d"/><text x="454" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="white">C</text>
  <text x="410" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#172b4d">C programs</text>
  <text x="410" y="386" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#506174"><tspan x="410">Control and</tspan><tspan x="410" dy="31">speed</tspan></text>
  <line x1="336" y1="446" x2="484" y2="446" stroke="#c58b22" stroke-width="3"/>
  <text x="410" y="463" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#a66e0c"><tspan x="410">More code for</tspan><tspan x="410" dy="25">small tools</tspan></text>

  <path d="M548 325H638" stroke="#197b83" stroke-width="9" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)"><rect x="665" y="150" width="497" height="350" rx="24" fill="white" stroke="#d8d1c3" stroke-width="2"/></g>
  <path d="M726 197h142l30 30v174H700V223a26 26 0 0126-26z" fill="#eef7f4" stroke="#197b83" stroke-width="6"/>
  <path d="M868 197v33h30" fill="none" stroke="#197b83" stroke-width="6"/>
  <path d="M746 267h103M746 305h126M746 343h82" stroke="#506174" stroke-width="8" stroke-linecap="round"/>
  <rect x="743" y="421" width="115" height="42" rx="21" fill="#197b83"/><text x="801" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">PYTHON</text>
  <rect x="910" y="248" width="225" height="58" rx="14" fill="#172b4d"/><text x="1022" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="white">Readable code</text>
  <rect x="910" y="322" width="225" height="58" rx="14" fill="#172b4d"/><text x="1022" y="359" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="white">Reusable modules</text>
  <rect x="910" y="396" width="225" height="76" rx="14" fill="#172b4d"/><text x="1022" y="426" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="white"><tspan x="1022">Connects to</tspan><tspan x="1022" dy="27">existing tools</tspan></text>

  <rect x="0" y="533" width="1200" height="67" fill="#172b4d"/>
  <text x="600" y="576" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="white">Clearer programs, with access to powerful tools</text>
</svg>
