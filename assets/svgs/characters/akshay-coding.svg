<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="100%" height="100%">
  <defs>
    <filter id="akshayCodeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="160" cy="220" r="130" fill="#F0FDF4" opacity="0.6"/>

  <g filter="url(#akshayCodeShadow)" transform="translate(40, 20)">
    <!-- Mustard Kurta Body -->
    <path d="M 60,160 L 170,160 L 180,340 L 45,340 Z" fill="#F59E0B" stroke="#B45309" stroke-width="4"/>
    <!-- Collar & Placket -->
    <path d="M 105,160 L 125,160 L 120,230 L 110,230 Z" fill="#D97706" stroke="#78350F" stroke-width="2"/>

    <!-- Desk / Keyboard Edge -->
    <rect x="20" y="270" width="200" height="30" rx="4" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <line x1="30" y1="285" x2="210" y2="285" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 3"/>

    <!-- Arms Typing on Keyboard -->
    <path d="M 65,170 L 45,230 L 80,270" stroke="#F59E0B" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M 165,170 L 185,230 L 150,270" stroke="#F59E0B" stroke-width="16" stroke-linecap="round" fill="none"/>
    <circle cx="80" cy="272" r="9" fill="#FDE68A" stroke="#B45309" stroke-width="2"/>
    <circle cx="150" cy="272" r="9" fill="#FDE68A" stroke="#B45309" stroke-width="2"/>

    <!-- Neck -->
    <rect x="100" y="130" width="30" height="35" fill="#FDE68A" stroke="#B45309" stroke-width="3"/>

    <!-- Head & Face (Focused) -->
    <ellipse cx="115" cy="95" rx="36" ry="42" fill="#FDE68A" stroke="#0F172A" stroke-width="4"/>

    <!-- Hair -->
    <path d="M 78,85 C 75,45 95,35 115,35 C 140,35 152,45 150,85 C 142,55 130,50 115,50 C 100,50 88,58 78,85 Z" fill="#1E293B"/>

    <!-- Focused Almond Eyes Looking Down at Screen -->
    <ellipse cx="102" cy="95" rx="7" ry="5" fill="#0F172A"/>
    <ellipse cx="128" cy="95" rx="7" ry="5" fill="#0F172A"/>
    <circle cx="100" cy="96" r="1.5" fill="#FFFFFF"/>
    <circle cx="126" cy="96" r="1.5" fill="#FFFFFF"/>

    <!-- Determined Mouth -->
    <path d="M 108,120 L 122,120" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Tag -->
  <rect x="70" y="365" width="180" height="26" rx="13" fill="#D97706"/>
  <text x="160" y="382" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">AKSHAY · LAB CODER</text>
</svg>
